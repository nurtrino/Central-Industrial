    main.innerHTML = _drShell(`
      <div class="pd-dropzone" style="cursor:default">
        <div class="pd-spinner"></div>
        <div class="pd-drop-title">Connecting to local server…</div>
      </div>`);

    let alive = await _pdAlive();
    if (!alive) {
      _pdFireProtocol();
      for (let i = 0; i < Math.ceil(PERF_WAIT_SEC / 1.5); i++) {
        await new Promise(r => setTimeout(r, 1500));
        alive = await _pdAlive();
        if (alive) break;
      }
    }
    if (myGen !== _dr.gen) return;
    if (!alive) { _drErrorNote('Could not reach the local server (dr_server.py on :5006). Start it from the Special Projects hub, then try again.'); return; }

    if (!skipClarify) {
      main.innerHTML = _drShell(`
        <div class="pd-dropzone" style="cursor:default">
          <div class="pd-spinner"></div>
          <div class="pd-drop-title">Scoping the question…</div>
        </div>`);
      try {
        const fd = new FormData(); fd.append('query', q); fd.append('provider', _dr.provider || 'claude');
        const r = await fetch(`${PERF_SERVER}/api/deep_research/clarify`, { method:'POST', body: fd });
        const j = await r.json();
        if (myGen !== _dr.gen) return;
        if (j.needs_clarification && (j.questions||[]).length) {
          _dr.clarify = j.questions; _dr.clarAns = {};
          main.innerHTML = _drShell(_drClarifyHtml(j.questions));
          return;
        }
      } catch (_) { /* clarify is best-effort */ }
    }
    drStartJob('');
  }

  function _drClarifyHtml(questions) {
    const fields = questions.map((qq, i) => `
      <div class="dr-clar-q">
        <label class="dr-label">${_esc(qq)}</label>
        <input class="dr-textarea" style="font-size:13px" oninput="_dr.clarAns[${i}]=this.value"
               value="${_esc(_dr.clarAns[i]||'')}" placeholder="Your answer (optional)">
      </div>`).join('');
    return `
      <div class="dr-query-block">
        <div class="dr-clar-head">A few quick questions to sharpen the search</div>
        <div class="dr-clar-sub">Answer what you can — blanks are fine. Or skip and research as written.</div>
        ${fields}
        <div class="dr-run-row">
          <button class="dr-run-btn" onclick="drSubmitClarify()">Research with these →</button>
          <button class="dr-run-btn dr-run-secondary" onclick="drStartJob('')">Skip &amp; research anyway</button>
        </div>
      </div>`;
  }
  function drSubmitClarify() {
    const qs = _dr.clarify || [];
    const lines = qs.map((qq, i) => {
      const a = (_dr.clarAns[i]||'').trim();
      return a ? `Q: ${qq}\nA: ${a}` : '';
    }).filter(Boolean);
    drStartJob(lines.join('\n\n'));
  }

  async function drStartJob(clarifications, extra) {
    const myGen = _dr.gen;
    _dr.credShown = false; _dr.credInputs = {}; _dr.skipReqStage = null;
    _dr.stopPrompt = false; _dr.stopChoice = false;
    _dr.refusalShown = false; _dr.refusalResolved = null; _dr.refusalLocal = null; _dr.refusalDetails = null;
    const q = (_dr.query || '').trim();
    const main = document.getElementById('ws-main-inner');

    const form = new FormData();
    form.append('query', q);
    form.append('depth', _dr.depth);
    form.append('provider', _dr.provider || 'claude');
    if (clarifications) form.append('clarifications', clarifications);
    if (extra && extra.refinement)  form.append('refinement', extra.refinement);
    if (extra && extra.prior_report) form.append('prior_report', extra.prior_report);
    for (const f of _dr.files) form.append('files', f);
    const memoF = _dr.files.find(f => f && f._memo);
    if (memoF) form.append('memo_filename', memoF.name);
    form.append('channels', JSON.stringify(_dr.channels || {}));
    const ctrl = new AbortController();
    _dr.abort = ctrl;

    let job;
    try {
      const resp = await fetch(`${PERF_SERVER}/api/deep_research`, { method: 'POST', body: form, signal: ctrl.signal });
      job = await resp.json();
      if (myGen !== _dr.gen) return;
      if (!resp.ok) throw new Error(job.error || `Server error ${resp.status}`);
    } catch (err) {
      if (err.name === 'AbortError' || myGen !== _dr.gen) return;
      _dr.abort = null; _drErrorNote(err.message); return;
    }
    const stages = job.stages || ['stage1','stage2','stage3','stage4','synthesize','report'];
    const jobId = job.job_id;
    _dr.jobId = jobId;
    actStartRun(jobId);
    const t0 = Date.now();

    main.innerHTML = _drShell(_drProgressHtml(stages, stages[0], null, 'Starting…', t0));
    while (true) {
      if (myGen !== _dr.gen) return;
      await new Promise(r => setTimeout(r, 1500));
      if (myGen !== _dr.gen) return;
      let st;
      try {
        const r = await fetch(`${PERF_SERVER}/api/deep_research/status?job=${jobId}&after=${_actAfter(jobId)}`, { signal: ctrl.signal });
        st = await r.json();
        if (!r.ok) throw new Error(st.error || `status ${r.status}`);
      } catch (err) {
        if (err.name === 'AbortError' || myGen !== _dr.gen) return;
        _dr.abort = null; _drErrorNote(err.message); return;
      }
      if (myGen !== _dr.gen) return;
      actIngest(jobId, st);
      if (st.error) { _dr.abort = null; _drErrorNote(st.error); return; }
      if (st.done && st.aborted) { _dr.abort = null; return; }   // user discarded — form already shown
      if (st.done)  { _dr.abort = null; _dr.data = st.result; renderContent(activeTool); return; }
      // Stash the latest render args so the Stop / refusal panels can redraw from them.
      _dr._stages = stages; _dr._cur = st.stage; _dr._pct = st.pct; _dr._msg = st.message; _dr._t0 = t0;
      const el = document.getElementById('ws-main-inner');
      if (!el) continue;
      // Highest priority: Claude declined and is waiting on the user's choice.
      if (st.awaiting_refusal_choice) {
        if (!_dr.refusalShown) {
          _dr.refusalShown = true; _dr.refusalDetails = st.awaiting_refusal_choice;
          el.innerHTML = _drShell(_drRefusalHtml(st.awaiting_refusal_choice));
        }
        continue;
      } else if (_dr.refusalShown) {
        // Server cleared the flag → worker resumed (or stopped). Drop the panel.
        _dr.refusalShown = false; _dr.refusalResolved = null;
        _dr.refusalLocal = null; _dr.refusalDetails = null;
      }
      if (st.awaiting_credentials && st.awaiting_credentials.length && !_dr.stopPrompt && !_dr.stopChoice) {
        if (!_dr.credShown) {
          _dr.credShown = true;
          _dr.credInputs = {};
          el.innerHTML = _drShell(_drCredentialsHtml(st.awaiting_credentials));
        }
      } else {
        _dr.credShown = false;
        // _drProgressHtml reads _dr.stopPrompt/stopChoice, so a live poll re-render
        // preserves the Stop choice panel rather than clobbering it.
        el.innerHTML = _drShell(_drProgressHtml(stages, st.stage, st.pct, st.message, t0));
      }
    }
  }

  function _drCredentialsHtml(candidates) {
    const rows = candidates.map((c, i) => `
      <div class="dr-cred-row">
        <div class="dr-cred-site">
          <div class="dr-cred-domain">${_esc(c.domain)}</div>
          <div class="dr-cred-reason">${_esc(c.reason || 'login required')}</div>
        </div>
        <div class="dr-cred-fields">
          <input class="dr-src-in" placeholder="username / email"
                 oninput="drCredSet(${i},'${_esc(c.domain)}','username',this.value)">
          <input class="dr-src-in" type="password" placeholder="password"
                 oninput="drCredSet(${i},'${_esc(c.domain)}','password',this.value)">
          <input class="dr-src-in" placeholder="login URL (optional)"
                 oninput="drCredSet(${i},'${_esc(c.domain)}','login_url',this.value)">
        </div>
      </div>`).join('');
    return `
      <div class="dr-query-block">
        <div class="dr-clar-head">Log in to ${candidates.length} gated source${candidates.length>1?'s':''}?</div>
        <div class="dr-clar-sub">The agent found these behind a login/paywall and judged them worth pursuing.
          Enter credentials for any you want it to access (saved to your encrypted local vault for next time),
          or skip. Sites needing 2FA/captcha are skipped automatically.</div>
        <div class="dr-cred-list">${rows}</div>
        <div class="dr-run-row">
          <button class="dr-run-btn" onclick="drSubmitCredentials()">Log in &amp; finish →</button>
          <button class="dr-run-btn dr-run-secondary" onclick="drSkipAllCredentials()">Skip all</button>
        </div>
      </div>`;
  }
  function drCredSet(i, domain, field, val) {
    _dr.credInputs = _dr.credInputs || {};
    (_dr.credInputs[domain] = _dr.credInputs[domain] || {})[field] = val;
  }
  async function drSubmitCredentials() {
    const payload = {};
    const inp = _dr.credInputs || {};
    Object.keys(inp).forEach(dom => {
      const c = inp[dom];
      payload[dom] = (c && (c.username||'').trim()) ? c : null;
    });
    await _drSendCredentials(payload);
  }
  function drSkipAllCredentials() { _drSendCredentials({}); }
  async function _drSendCredentials(credentials) {
    const jobId = _dr.jobId;
    if (!jobId) return;
    _dr.credShown = false;
    const main = document.getElementById('ws-main-inner');
    if (main) main.innerHTML = _drShell(`<div class="pd-dropzone" style="cursor:default"><div class="pd-spinner"></div><div class="pd-drop-title">Logging in &amp; finishing…</div></div>`);
    try {
      await fetch(`${PERF_SERVER}/api/deep_research/credentials?job=${jobId}`, {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ credentials }) });
    } catch (_) {}
  }

  const DR_STAGE_LABELS = {
    stage1: 'Baseline sweep',
    stage2: 'Parallel research lanes (Chrome + APIs)',
    stage3: 'Credentialed sources',
    stage4: 'Gated sources (login)',
    odysseus: 'Odysseus pre-research (headless)',
    synthesize: 'Extract & synthesize report',
    report: 'Assemble report',
  };

  function _drProgressHtml(stages, cur, pct, message, t0) {
    const curIdx = stages.indexOf(cur);
    // Stage 1 is the broad baseline browser sweep (all providers); with the
    // baseline channel toggled off it's just planning.
    const baselineOn = !_dr.channels || _dr.channels.api_search !== false;
    const rows = stages.map((s, i) => {
      const cls = i < curIdx ? 'done' : (i === curIdx ? 'active' : 'pending');
      const ic  = cls === 'done' ? '✓' : (cls === 'active' ? '<span class="mn-mini-spin"></span>' : '○');
      const detail = (cls === 'active' && message) ? `<span class="mn-stage-detail">${_esc(message)}</span>` : '';
      const lbl = (s === 'stage1') ? (baselineOn ? 'Baseline sweep' : 'Planning') : (DR_STAGE_LABELS[s] || s);
      return `<div class="mn-stage ${cls}"><span class="mn-stage-ic">${ic}</span>
                <span class="mn-stage-label">${lbl}</span>${detail}</div>`;
    }).join('');
    const bar = (typeof pct === 'number')
      ? `<div class="mn-bar-fill" style="width:${pct}%"></div>`
      : `<div class="mn-bar-fill mn-bar-indet"></div>`;
    const secs = Math.round((Date.now() - t0) / 1000);
    const elapsed = `${Math.floor(secs / 60)}m ${secs % 60}s`;
    const canSkip = ['stage2','stage3','stage4'].includes(cur) && _dr.skipReqStage !== cur;
    const skipBtn = canSkip
      ? `<button class="dr-skip-btn" onclick="drSkipStage('${cur}')">Skip this stage →</button>`
      : (_dr.skipReqStage === cur ? `<div class="dr-skip-note">Wrapping up this stage…</div>` : '');
    // Stop control: once pressed, the two-choice panel replaces the buttons; while
    // assembling-after-stop it shows a note. Not offered during final synthesis/report.
    const inGather = !['synthesize','report'].includes(cur);
    let controls;
    if (_dr.stopChoice) {
      controls = `<div class="dr-stop-note">Stopped — assembling the report from what was gathered…</div>`;
    } else if (_dr.stopPrompt) {
      controls = `
        <div class="dr-stop-panel">
          <div class="dr-stop-q">Stopped. What next?</div>
          <div class="dr-stop-actions">
            <button class="dr-run-btn" onclick="drStopChoose('assemble')">Assemble report from what's gathered →</button>
            <button class="dr-run-btn dr-run-secondary" onclick="drStopChoose('abort')">Discard &amp; start a new query</button>
          </div>
        </div>`;
    } else {
      const stopBtn = inGather
        ? `<button class="dr-stop-btn" onclick="drStopRun()">⏹ Stop</button>` : '';
      controls = `<div class="dr-run-controls">${stopBtn}${skipBtn}</div>`;
    }
    return `
      <div class="mn-progress">
        <div class="mn-progress-title">Researching…</div>
        <div class="mn-stages">${rows}</div>
        <div class="mn-bar">${bar}</div>
        <div class="mn-elapsed">elapsed ${elapsed}</div>
        ${controls}
      </div>`;
  }
  async function drSkipStage(stage) {
    if (!_dr.jobId) return;
    _dr.skipReqStage = stage;
    const el = document.getElementById('ws-main-inner');
    const b = el && el.querySelector('.dr-skip-btn');
    if (b) { b.outerHTML = '<div class="dr-skip-note">Wrapping up this stage…</div>'; }
    try {
      await fetch(`${PERF_SERVER}/api/deep_research/skip_stage?job=${_dr.jobId}`, { method:'POST' });
    } catch (_) {}
  }
  // Stop pressed → show the two-choice panel (client-side; nothing sent to the
  // server until the user picks — so the run keeps going until they decide).
  function drStopRun() {
    if (!_dr.jobId) return;
    _dr.stopPrompt = true;
    const el = document.getElementById('ws-main-inner');
    if (el) el.innerHTML = _drShell(_drProgressHtml(_dr._stages || DR_STAGES, _dr._cur || 'stage2', _dr._pct, _dr._msg || '', _dr._t0 || Date.now()));
  }
  async function drStopChoose(mode) {
    if (!_dr.jobId) return;
    if (mode === 'abort') {
      // Discard: tell the worker to stop + drop, cancel polling, return to a fresh form.
      try { await fetch(`${PERF_SERVER}/api/deep_research/stop?job=${_dr.jobId}`, {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ mode:'abort' }) }); } catch (_) {}
      _dr.gen++;                        // invalidate the in-flight poll loop
      drClear();                        // reset to the query form
      return;
    }
    // Assemble: stop gathering, let the worker synthesize the partial harvest.
    _dr.stopPrompt = false; _dr.stopChoice = true;
    const el = document.getElementById('ws-main-inner');
    if (el) el.innerHTML = _drShell(_drProgressHtml(_dr._stages || DR_STAGES, 'synthesize', null, 'Assembling…', _dr._t0 || Date.now()));
    try { await fetch(`${PERF_SERVER}/api/deep_research/stop?job=${_dr.jobId}`, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ mode:'assemble' }) }); } catch (_) {}
  }

  /* ── Claude refusal → offer the local model, confirm it's up, then resume ── */
  function _drRefusalHtml(d) {
    const cat = (d && d.category) || 'safety';
    const local = _dr.refusalLocal;   // {ok, model} after a probe
    let body;
    if (_dr.refusalResolved === 'abort') {
      body = `<div class="dr-stop-note">Stopping — assembling the report from what was gathered…</div>`;
    } else if (_dr.refusalResolved === 'local') {
      body = `<div class="dr-stop-note">Switched to your local model${local && local.model ? ' (' + _esc(local.model) + ')' : ''} — resuming the research from where Claude declined…</div>`;
    } else if (local && local.ok) {
      body = `
        <div class="dr-refusal-confirm">Local model detected: <strong>${_esc(local.model)}</strong>.</div>
        <div class="dr-refusal-sub">Continue this research on your local model, picking up from the point Claude declined?</div>
        <div class="dr-stop-actions">
          <button class="dr-run-btn" onclick="drRefusalConfirmLocal()">Continue on local model →</button>
          <button class="dr-run-btn dr-run-secondary" onclick="drRefusalAbort()">Stop &amp; assemble what we have</button>
        </div>`;
    } else if (local && !local.ok) {
      body = `
        <div class="dr-refusal-sub" style="color:#ffb37a">No local model detected. Start LM Studio, load a model, and turn on its local server (Developer tab), then re-check.</div>
        <div class="dr-stop-actions">
          <button class="dr-run-btn" onclick="drRefusalSwitchLocal()">Re-check for a local model</button>
          <button class="dr-run-btn dr-run-secondary" onclick="drRefusalAbort()">Stop &amp; assemble what we have</button>
        </div>`;
    } else {
      body = `
        <div class="dr-refusal-sub">Continue with your local model instead? It must be running in LM Studio with a model loaded.</div>
        <div class="dr-stop-actions">
          <button class="dr-run-btn" onclick="drRefusalSwitchLocal()">Switch to local model →</button>
          <button class="dr-run-btn dr-run-secondary" onclick="drRefusalAbort()">Stop &amp; assemble what we have</button>
        </div>`;
    }
    return `
      <div class="mn-progress">
        <div class="dr-refusal-panel">
          <div class="dr-refusal-head">⚠ Claude declined part of this research</div>
          <div class="dr-refusal-cat">Safety refusal${cat ? ' · ' + _esc(cat) : ''}. The research is paused at that step so nothing is lost.</div>
          ${body}
        </div>
      </div>`;
  }
  function _drRefusalRerender() {
    const el = document.getElementById('ws-main-inner');
    if (el) el.innerHTML = _drShell(_drRefusalHtml(_dr.refusalDetails || {}));
  }
  async function drRefusalSwitchLocal() {
    // Confirm a local model is actually loaded before offering to continue on it.
    try {
      const r = await fetch(`${PERF_SERVER}/api/deep_research/local_model`);
      const j = await r.json();
      _dr.refusalLocal = { ok: !!j.ok, model: j.model || '' };
    } catch (_) { _dr.refusalLocal = { ok: false, model: '' }; }
    _drRefusalRerender();
  }
  async function drRefusalConfirmLocal() {
    _dr.refusalResolved = 'local';
    _drRefusalRerender();
    try { await fetch(`${PERF_SERVER}/api/deep_research/refusal_choice?job=${_dr.jobId}`, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ mode:'local' }) }); } catch (_) {}
  }
  async function drRefusalAbort() {
    _dr.refusalResolved = 'abort';
    _drRefusalRerender();
    try { await fetch(`${PERF_SERVER}/api/deep_research/refusal_choice?job=${_dr.jobId}`, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ mode:'abort' }) }); } catch (_) {}
  }

  /* ════════════════════════════════════════════════════════════════════
     ODYSSEUS RESEARCH — sub-tool (A/B comparison engine). Lifted from the
     original platform. Reuses Deep Research's controls/styles; renders into its
     OWN #or-main-inner so the two views are independent (a run in one view
     keeps updating even while the other is shown).
     ════════════════════════════════════════════════════════════════════ */
  const _or = { data: null, abort: null, gen: 0, query: '', rounds: 4, jobId: null };

  function orReset() {
    if (_or.abort) { try { _or.abort.abort(); } catch (_) {} _or.abort = null; }
    _or.gen++; _or.data = null; _or.jobId = null;
  }
  function orClear() { orReset(); _orRender(); }
  function orSetRounds(n) { _or.rounds = n; _orRender(); }

  function _orRender() {
    const d = _or.data;
    document.getElementById('or-main-inner').innerHTML = `
      <div class="tool-content pd-outer">
        <div class="pd-header-row">
          <div><div class="ha-eyebrow">Comparison Engine</div>
               <div class="ha-title">Odysseus Research</div></div>
          ${d ? `<button class="pd-clear-btn" onclick="orClear()">✕ Clear</button>` : ''}
        </div>
        ${d ? _orResultsHtml() : _orForm()}
      </div>`;
  }

  function _orForm() {
    const tiers = [
      { n:4, label:'Standard', sub:'4 rounds' },
      { n:8, label:'Deep',     sub:'8 rounds' },
    ];
    const chips = tiers.map(t => `
      <button type="button" class="dr-chip ${_or.rounds===t.n?'active':''}" onclick="orSetRounds(${t.n})">
        <span class="dr-chip-label">${t.label}</span><span class="dr-chip-sub">${t.sub}</span>
      </button>`).join('');
    return `
      <div class="dr-query-block">
        <div class="dr-run-note" style="margin:0 0 14px">Vendored <strong>Odysseus / Alibaba IterResearch</strong>
          engine (headless: DuckDuckGo + page-fetch), running on the same Claude model as Deep Research — here to
          A/B the <em>methodology</em>. Note: it can't log into gated sites or be watched in a browser (that's Deep Research's edge).</div>
        <label class="dr-label">Research question</label>
        <textarea id="or-query" class="dr-textarea" rows="3"
          placeholder="Same kind of question you'd give Deep Research."
          oninput="_or.query = this.value">${_esc(_or.query)}</textarea>
        <label class="dr-label" style="margin-top:18px">Depth (rounds)</label>
        <div class="dr-chips">${chips}</div>
        <button class="dr-run-btn" onclick="orRun()">Run Odysseus Research →</button>
      </div>`;
  }

  function _orResultsHtml() {
    const d = _or.data;
    if (!d || !d.report_md) return '<div style="color:var(--text-muted);padding:20px">No report produced.</div>';
    const html = (typeof marked !== 'undefined') ? marked.parse(d.report_md) : d.report_md.replace(/\n/g,'<br>');
    const s = d.stats || {};
    const statline = Object.keys(s).map(k => `<strong style="color:var(--text-secondary)">${_esc(k)}:</strong> ${_esc(String(s[k]))}`).join(' &nbsp;·&nbsp; ');
    return `
      <div class="vc-memo-outer">
        <div class="vc-memo-toolbar">
          <div class="vc-memo-files"><strong style="color:var(--text-secondary)">Question:</strong> ${_esc(d.query || _or.query)}${_savedBadge(d.saved_path)}</div>
          <div style="display:flex;gap:8px;flex-wrap:wrap">
            ${d.docx_b64 ? `<button class="vc-memo-download" onclick="orDownloadDocx()">💾 Save &amp; open in Word</button>` : ''}
          </div>
        </div>
        ${statline ? `<div style="font-size:11.5px;color:var(--text-muted);margin-bottom:12px">${statline}</div>` : ''}
        <div class="vc-memo-body">${html}</div>
      </div>`;
  }

  function orDownloadDocx() {
    const d = _or.data; if (!d || !d.docx_b64) return;
    saveAndOpen(d.docx_b64, d.query || _or.query, 'Odysseus', 'Odysseus Research — Report.docx', d.title);
  }

  function _orShell(inner) {
    return `<div class="tool-content pd-outer"><div class="pd-header-row">
        <div><div class="ha-eyebrow">Comparison Engine</div><div class="ha-title">Odysseus Research</div></div>
      </div>${inner}</div>`;
  }
  function _orErr(msg) {
    const m = document.getElementById('or-main-inner'); if (!m) return;
    const isKey = msg && msg.includes('ANTHROPIC_API_KEY');
    m.innerHTML = _orShell(`<div class="pd-dropzone" style="cursor:default">
      <div class="pd-drop-title">Odysseus run failed</div>
      <div style="margin:14px auto 0;padding:12px 16px;border-radius:8px;background:rgba(255,85,85,.08);
           border:1px solid rgba(255,85,85,.3);font-size:11.5px;color:#ff8888;max-width:600px;text-align:left;line-height:1.7">
        ${isKey ? '<strong>API key not configured.</strong> Add ANTHROPIC_API_KEY to .env and restart the server.'
                : `<pre style="white-space:pre-wrap;font-family:monospace;font-size:10.5px;margin:0">${_esc(msg)}</pre>`}</div>
      <button class="dr-run-btn" style="margin-top:16px" onclick="orClear()">← Back</button></div>`);
  }
  function _orProgressHtml(message, stats, t0) {
    const secs = Math.round((Date.now() - t0) / 1000);
    const elapsed = `${Math.floor(secs/60)}m ${secs%60}s`;
    const bits = [];
    if (stats && stats.round) bits.push(`round ${stats.round}`);
    if (stats && stats.sources != null) bits.push(`${stats.sources} sources`);
    if (stats && stats.findings != null) bits.push(`${stats.findings} findings`);
    return `<div class="pd-dropzone" style="cursor:default">
        <div class="pd-spinner"></div>
        <div class="pd-drop-title">${_esc(message || 'Researching…')}</div>
        <div class="pd-drop-sub">${bits.join(' · ')}${bits.length?' · ':''}elapsed ${elapsed}</div>
      </div>`;
  }

  async function orRun() {
    const q = (_or.query || '').trim();
    if (!q) { const t = document.getElementById('or-query');
      if (t) { t.focus(); t.classList.add('dr-textarea-err'); setTimeout(()=>t.classList.remove('dr-textarea-err'),1200);} return; }
    const myGen = ++_or.gen;
    const main = document.getElementById('or-main-inner');
    main.innerHTML = _orShell(`<div class="pd-dropzone" style="cursor:default"><div class="pd-spinner"></div><div class="pd-drop-title">Connecting to local server…</div></div>`);
    let alive = await _pdAlive();
    if (!alive) { _pdFireProtocol();
      for (let i=0;i<Math.ceil(PERF_WAIT_SEC/1.5);i++){ await new Promise(r=>setTimeout(r,1500)); alive=await _pdAlive(); if(alive)break; } }
    if (myGen !== _or.gen) return;
    if (!alive) { _orErr('Could not reach the local server (dr_server.py on :5006). Start it from the Special Projects hub, then try again.'); return; }

    const form = new FormData();
    form.append('query', q); form.append('max_rounds', String(_or.rounds));
    const ctrl = new AbortController(); _or.abort = ctrl;
    let job;
    try {
      const resp = await fetch(`${PERF_SERVER}/api/odysseus_research`, { method:'POST', body:form, signal:ctrl.signal });
      job = await resp.json();
      if (myGen !== _or.gen) return;
      if (!resp.ok) throw new Error(job.error || `Server error ${resp.status}`);
    } catch (err) { if (err.name==='AbortError'||myGen!==_or.gen) return; _or.abort=null; _orErr(err.message); return; }
    _or.jobId = job.job_id; const t0 = Date.now();
    actStartRun(_or.jobId);
    main.innerHTML = _orShell(_orProgressHtml('Starting Odysseus engine…', {}, t0));
    while (true) {
      if (myGen !== _or.gen) return;
      await new Promise(r => setTimeout(r, 2000));
      if (myGen !== _or.gen) return;
      let st;
      try {
        const r = await fetch(`${PERF_SERVER}/api/odysseus_research/status?job=${_or.jobId}&after=${_actAfter(_or.jobId)}`, { signal: ctrl.signal });
        st = await r.json();
        if (!r.ok) throw new Error(st.error || `status ${r.status}`);
      } catch (err) { if (err.name==='AbortError'||myGen!==_or.gen) return; _or.abort=null; _orErr(err.message); return; }
      if (myGen !== _or.gen) return;
      actIngest(_or.jobId, st);
      if (st.error) { _or.abort=null; _orErr(st.error); return; }
      if (st.done) { _or.abort=null; _or.data = st.result; _orRender(); return; }
      const el = document.getElementById('or-main-inner');
      if (el) el.innerHTML = _orShell(_orProgressHtml(st.message, st.stats, t0));
    }
  }

  /* ── view switch: Deep Research ⇄ Odysseus ⇄ Firecrawl (lazy-render once) ── */
  var _viewRendered = { od: false, fc: false };
  function setView(v) {
    var map = { dr: 'view-dr', od: 'view-od', fc: 'view-fc' };
    Object.keys(map).forEach(function (k) {
      var el = document.getElementById(map[k]); if (el) el.classList.toggle('hidden', k !== v);
    });
    var items = document.querySelectorAll('.navitem');
    for (var i = 0; i < items.length; i++) {
      items[i].classList.toggle('active', items[i].getAttribute('data-view') === v);
    }
    if (v === 'od' && !_viewRendered.od) { _viewRendered.od = true; _orRender(); }
    if (v === 'fc' && !_viewRendered.fc) { _viewRendered.fc = true; _fcRender(); }
  }

  /* ════════════════════════════════════════════════════════════════════
     FIRECRAWL — sub-tool. A data-driven console over the Firecrawl v2 REST API.
     All calls go through the server-side proxy /api/firecrawl/<path> (the key
     stays on the server). Async tools (crawl/batch/extract/llmstxt) return a
     job id → "Check status →" jumps to the matching Status tool.
     ════════════════════════════════════════════════════════════════════ */
  const FC_TOOLS = [
    { id:'scrape', name:'Scrape', method:'POST', path:'v2/scrape', desc:'Scrape one URL → clean markdown / HTML / links / screenshot.',
      fields:[ {k:'url',label:'URL',type:'text',required:true,ph:'https://example.com'},
               {k:'formats',label:'Formats',type:'multi',opts:['markdown','html','rawHtml','links','screenshot'],def:['markdown']},
               {k:'onlyMainContent',label:'Only main content (strip nav/footer/ads)',type:'bool',def:true} ]},
    { id:'search', name:'Search', method:'POST', path:'v2/search', desc:'Web search → ranked results.',
      fields:[ {k:'query',label:'Query',type:'text',required:true,ph:'who founded …'},
               {k:'limit',label:'Max results',type:'number',def:5} ]},
    { id:'map', name:'Map', method:'POST', path:'v2/map', desc:'Discover all URLs on a site (fast, no scrape).',
      fields:[ {k:'url',label:'URL',type:'text',required:true,ph:'https://example.com'},
               {k:'search',label:'Filter (optional)',type:'text',ph:'blog'},
               {k:'limit',label:'Limit (optional)',type:'number'} ]},
    { id:'crawl', name:'Crawl', method:'POST', path:'v2/crawl', async:true, statusId:'crawl_status', desc:'Crawl a whole site (async → job id).',
      fields:[ {k:'url',label:'URL',type:'text',required:true,ph:'https://example.com'},
               {k:'limit',label:'Max pages',type:'number',def:25},
               {k:'maxDiscoveryDepth',label:'Max depth (optional)',type:'number'} ]},
    { id:'crawl_status', name:'Crawl Status', method:'GET', path:'v2/crawl/{id}', desc:'Fetch a crawl job by id.',
      fields:[ {k:'id',label:'Job ID',type:'text',required:true} ]},
    { id:'batch', name:'Batch Scrape', method:'POST', path:'v2/batch/scrape', async:true, statusId:'batch_status', desc:'Scrape many URLs at once (async → job id).',
      fields:[ {k:'urls',label:'URLs (one per line)',type:'lines',required:true,ph:'https://a.com\nhttps://b.com'},
               {k:'formats',label:'Formats',type:'multi',opts:['markdown','html','rawHtml','links'],def:['markdown']} ]},
    { id:'batch_status', name:'Batch Status', method:'GET', path:'v2/batch/scrape/{id}', desc:'Fetch a batch-scrape job by id.',
      fields:[ {k:'id',label:'Job ID',type:'text',required:true} ]},
    { id:'extract', name:'Extract', method:'POST', path:'v2/extract', async:true, statusId:'extract_status', desc:'LLM-structured extraction from pages (async → job id).',
      fields:[ {k:'urls',label:'URLs (one per line)',type:'lines',required:true,ph:'https://example.com'},
               {k:'prompt',label:'Extraction prompt',type:'textarea',ph:'Extract the page title, author, and publication date.'},
               {k:'schema',label:'JSON schema (optional)',type:'json',ph:'{ "type": "object", "properties": { } }'} ]},
    { id:'extract_status', name:'Extract Status', method:'GET', path:'v2/extract/{id}', desc:'Fetch an extract job by id.',
      fields:[ {k:'id',label:'Job ID',type:'text',required:true} ]},
    { id:'llmstxt', name:'Generate llms.txt', method:'POST', path:'v2/llmstxt', async:true, statusId:'llmstxt_status', desc:'Generate an llms.txt for a site (async → job id).',
      fields:[ {k:'url',label:'URL',type:'text',required:true,ph:'https://example.com'},
               {k:'maxUrls',label:'Max URLs (optional)',type:'number'},
               {k:'showFullText',label:'Include full text',type:'bool',def:false} ]},
    { id:'llmstxt_status', name:'llms.txt Status', method:'GET', path:'v2/llmstxt/{id}', desc:'Fetch an llms.txt job by id.',
      fields:[ {k:'id',label:'Job ID',type:'text',required:true} ]},
  ];
  const _fc = { tool: 'scrape', values: {}, busy: false, result: null, error: null };

  function _fcCur() { return FC_TOOLS.find(t => t.id === _fc.tool) || FC_TOOLS[0]; }
  function fcSelectTool(id) { _fc.tool = id; _fc.result = null; _fc.error = null; _fc.busy = false; _fcRender(); }
  function fcSetVal(k, v) { _fc.values[`${_fc.tool}.${k}`] = v; }
  function fcGetVal(k) { return _fc.values[`${_fc.tool}.${k}`]; }
  function fcToggleMulti(k, opt, on) {
    const def = (_fcCur().fields.find(f => f.k === k) || {}).def || [];
    let arr = Array.isArray(fcGetVal(k)) ? fcGetVal(k).slice() : def.slice();
    if (on) { if (!arr.includes(opt)) arr.push(opt); } else { arr = arr.filter(x => x !== opt); }
    fcSetVal(k, arr); _fcRender();
  }

  function _fcShell(inner) {
    return `<div class="tool-content pd-outer">
      <div class="pd-header-row">
        <div><div class="ha-eyebrow">Web Scraper · Firecrawl API</div><div class="ha-title">Firecrawl</div></div>
        <button class="pd-clear-btn" onclick="fcTest()" title="Test the Firecrawl API key / connection">⚡ Test connection</button>
      </div>${inner}</div>`;
  }
  function _fcRender() {
    const cur = _fcCur();
    const tabs = FC_TOOLS.map(t => `<button class="fc-tab ${t.id === _fc.tool ? 'active' : ''}" onclick="fcSelectTool('${t.id}')">${t.name}</button>`).join('');
    document.getElementById('fc-main-inner').innerHTML = _fcShell(`
      <div class="fc-tabs">${tabs}</div>
      <div class="fc-desc">${_esc(cur.desc || '')} &nbsp;·&nbsp; <code>${cur.method} /${cur.path}</code></div>
      ${cur.fields.map(_fcField).join('')}
      <button class="dr-run-btn" onclick="fcRun()" ${_fc.busy ? 'disabled' : ''}>${_fc.busy ? 'Running…' : ('Run ' + cur.name + ' →')}</button>
      ${_fcResultHtml()}`);
  }
  function _fcField(f) {
    const v = fcGetVal(f.k);
    if (f.type === 'bool') {
      const on = v == null ? !!f.def : !!v;
      return `<div class="fc-field"><label class="dr-toggle ${on ? 'on' : 'off'}" style="max-width:none">
        <input type="checkbox" ${on ? 'checked' : ''} onchange="fcSetVal('${f.k}', this.checked);_fcRender()">
        <span class="dr-toggle-sw"></span><span class="dr-toggle-txt"><span class="dr-toggle-label">${_esc(f.label)}</span></span></label></div>`;
    }
    let ctrl;
    if (f.type === 'multi') {
      const sel = Array.isArray(v) ? v : (f.def || []);
      ctrl = `<div class="dr-toggle-row">${f.opts.map(o => `<label class="dr-toggle ${sel.includes(o) ? 'on' : 'off'}">
        <input type="checkbox" ${sel.includes(o) ? 'checked' : ''} onchange="fcToggleMulti('${f.k}','${o}', this.checked)">
        <span class="dr-toggle-sw"></span><span class="dr-toggle-txt"><span class="dr-toggle-label">${o}</span></span></label>`).join('')}</div>`;
    } else if (f.type === 'textarea' || f.type === 'lines' || f.type === 'json') {
      ctrl = `<textarea class="dr-textarea" rows="${f.type === 'json' ? 6 : 4}" placeholder="${_esc(f.ph || '')}" oninput="fcSetVal('${f.k}', this.value)">${_esc(v == null ? '' : v)}</textarea>`;
    } else {
      ctrl = `<input class="fc-in" type="${f.type === 'number' ? 'number' : 'text'}" placeholder="${_esc(f.ph || '')}" value="${_esc(v == null ? '' : v)}" oninput="fcSetVal('${f.k}', this.value)">`;
    }
    return `<div class="fc-field"><label class="dr-label">${_esc(f.label)}${f.required ? ' *' : ''}</label>${ctrl}</div>`;
  }

  async function fcRun() {
    const cur = _fcCur();
    let path = cur.path; const body = {};
    for (const f of cur.fields) {
      let v = fcGetVal(f.k);
      if (f.type === 'lines') v = (v || '').split('\n').map(s => s.trim()).filter(Boolean);
      else if (f.type === 'number') v = (v === '' || v == null) ? undefined : Number(v);
      else if (f.type === 'bool') v = (v == null ? !!f.def : !!v);
      else if (f.type === 'multi') v = Array.isArray(v) ? v : (f.def || []);
      else if (f.type === 'json') { if (v && v.trim()) { try { v = JSON.parse(v); } catch (e) { _fc.error = 'JSON schema is invalid: ' + e.message; _fc.result = null; _fcRender(); return; } } else v = undefined; }
      else v = (v == null ? '' : String(v)).trim();
      if (f.required && (v === undefined || v === '' || (Array.isArray(v) && !v.length))) { _fc.error = `${f.label} is required.`; _fc.result = null; _fcRender(); return; }
      if (f.k === 'id') { path = path.replace('{id}', encodeURIComponent(v)); continue; }
      if (v !== undefined && v !== '' && !(Array.isArray(v) && !v.length)) body[f.k] = v;
    }
    _fc.busy = true; _fc.error = null; _fc.result = null; _fcRender();
    try {
      const opts = cur.method === 'GET' ? {} : { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) };
      const r = await fetch(`${PERF_SERVER}/api/firecrawl/${path}`, opts);
      const j = await r.json();
      _fc.busy = false;
      if (!r.ok) _fc.error = (j && j.error) || ('Firecrawl error ' + r.status + ': ' + JSON.stringify(j));
      else _fc.result = j;
    } catch (e) { _fc.busy = false; _fc.error = 'Request failed: ' + e.message; }
    _fcRender();
  }
  function fcCheckStatus(id, statusId) {
    _fc.tool = statusId; _fc.values[`${statusId}.id`] = id; _fc.result = null; _fc.error = null;
    _fcRender(); fcRun();
  }
  async function fcTest() {
    _toast('Testing Firecrawl connection…');
    try {
      const r = await fetch(`${PERF_SERVER}/api/firecrawl/v2/map`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ url: 'https://firecrawl.dev' }) });
      const j = await r.json();
      if (r.ok && j && j.success !== false) _toast('✓ Firecrawl connected — the key works.');
      else _toast('Firecrawl test failed: ' + ((j && j.error) || ('HTTP ' + r.status)), false);
    } catch (e) { _toast('Firecrawl test failed: ' + e.message, false); }
  }
  function _fcCollectMarkdown(j) {
    const out = [];
    const push = (x) => { if (x && typeof x === 'object' && typeof x.markdown === 'string' && x.markdown.trim())
      out.push((x.metadata && x.metadata.sourceURL ? ('## ' + x.metadata.sourceURL + '\n\n') : '') + x.markdown.trim()); };
    const d = j && j.data;
    if (d) { if (Array.isArray(d)) d.forEach(push); else { push(d); ['web', 'news', 'images'].forEach(kk => { if (Array.isArray(d[kk])) d[kk].forEach(push); }); } }
    return out.join('\n\n---\n\n');
  }
  function _fcResultHtml() {
    if (_fc.busy) return `<div class="pd-dropzone" style="cursor:default;margin-top:20px"><div class="pd-spinner"></div><div class="pd-drop-title">Running…</div></div>`;
    if (_fc.error) return `<div style="margin-top:18px;padding:12px 16px;border-radius:8px;background:rgba(255,85,85,.08);border:1px solid rgba(255,85,85,.3);font-size:12px;color:#ff8888;white-space:pre-wrap">${_esc(_fc.error)}</div>`;
    if (!_fc.result) return '';
    const j = _fc.result, cur = _fcCur();
    const parts = [];
    const jobId = j.id || j.jobId;
    if (cur.async && jobId) parts.push(`<div class="fc-jobid">Job started — <code>${_esc(jobId)}</code>
      <button class="dr-run-btn dr-run-secondary" style="margin:0;padding:6px 12px" onclick="fcCheckStatus('${_esc(jobId)}','${cur.statusId}')">Check status →</button></div>`);
    const md = _fcCollectMarkdown(j);
    if (md) parts.push(`<div class="vc-memo-body">${(typeof marked !== 'undefined') ? marked.parse(md) : _esc(md)}</div>`);
    parts.push(`<details ${md ? '' : 'open'} style="margin-top:14px"><summary style="cursor:pointer;color:var(--text-secondary);font-size:12.5px">Raw JSON response</summary><pre class="fc-json" style="margin-top:10px">${_esc(JSON.stringify(j, null, 2))}</pre></details>`);
    return `<div class="vc-memo-outer" style="margin-top:8px">${parts.join('')}</div>`;
  }

  /* boot */
  document.addEventListener('DOMContentLoaded', _drRender);
  if (document.readyState !== 'loading') _drRender();
</script>
</body>
</html>
