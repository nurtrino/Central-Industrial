<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <title>Deep Research</title>
  <!-- Vendored locally (no CDN): markdown renderer + Inter / JetBrains Mono fonts -->
  <link href="/fonts/fonts.css" rel="stylesheet" />
  <script src="/vendor/marked.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ════════════════════════════════════════════════════════════════════
       Special Projects — PHOSPHOR TERMINAL theme (shared with Monkey Read
       Monkey Do). Green-on-black CRT green-screen look. Keep this palette in
       sync across the two tools so the suite reads as one. */
    :root {
      --bg-base:      #04100A;
      --bg-surface:   #08180E;
      --bg-card:      #0A1E12;
      --bg-elevated:  #0C2414;
      --bg-hover:     #103018;

      --border-dim:   #103A1C;
      --border-mid:   #1C5A2C;
      --border-bright:#2A7A3A;

      --text-primary: #3BE859;   /* phosphor green */
      --text-secondary:#23B045;
      --text-muted:   #178A33;
      --text-accent:  #74FB80;   /* bright highlight */

      --hf-color:  #34E25A; --hf-glow: rgba(52,226,90,.18); --hf-sub: rgba(52,226,90,.08);
      --admin-color: #34D24F; --admin-glow: rgba(52,210,79,.20); --admin-sub: rgba(52,210,79,.09);

      /* the workspace accent resolves to the green accent everywhere */
      --ws-color: var(--admin-color); --ws-glow: var(--admin-glow); --ws-sub: var(--admin-sub);

      font-family: 'JetBrains Mono', ui-monospace, 'Cascadia Code', Consolas, monospace;
      font-size: 14px;
    }

    html, body { height: 100%; background: var(--bg-base); color: var(--text-primary); -webkit-font-smoothing: antialiased; zoom: 1.12; }
    .hidden { display: none !important; }
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border-mid); border-radius: 3px; }

    /* page shell (replaces the old SPA sidebar/workspace chrome) */
    .topbar {
      position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 14px;
      padding: 10px 20px; background: rgba(8,8,17,.85); backdrop-filter: blur(6px);
      border-bottom: 1px solid var(--border-dim);
    }
    .topbar a.back {
      font-size: 12px; color: var(--text-secondary); text-decoration: none;
      border: 1px solid var(--border-mid); border-radius: 7px; padding: 6px 12px;
      transition: border-color .15s, color .15s;
    }
    .topbar a.back:hover { border-color: var(--admin-color); color: var(--text-primary); }
    .topbar .brand { font-size: 12.5px; font-weight: 600; letter-spacing: .04em; color: var(--admin-color); }
    .topbar .brand .dim { color: var(--text-muted); font-weight: 400; }
    .shell { display: flex; align-items: flex-start; }
    .sidenav {
      flex: 0 0 196px; position: sticky; top: 0; align-self: flex-start;
      padding: 26px 14px; display: flex; flex-direction: column; gap: 7px;
      border-right: 1px solid var(--border-dim); box-sizing: border-box;
    }
    .sidenav-h { font-size: 10px; letter-spacing: .18em; color: var(--text-muted); text-transform: uppercase; margin-bottom: 8px; }
    .navitem {
      display: block; text-align: left; background: transparent; border: 1px solid transparent;
      border-radius: 8px; padding: 9px 12px; color: var(--text-secondary);
      font-family: inherit; font-size: 13px; cursor: pointer;
      transition: border-color .12s, color .12s, background .12s;
    }
    .navitem:hover { border-color: var(--border-mid); color: var(--text-primary); }
    .navitem.active { background: var(--ws-sub); border-color: var(--ws-color); color: var(--text-primary); text-shadow: 0 0 7px var(--ws-glow); }
    .sidenav-note { margin-top: 16px; font-size: 11px; line-height: 1.55; color: var(--text-muted); }
    .page { flex: 1; min-width: 0; padding: 34px 24px 90px; display: flex; justify-content: center; }
    .view { width: 100%; }
    .view.hidden { display: none; }
    #ws-main-inner, #or-main-inner { width: 100%; max-width: 980px; margin: 0 auto; }
    .subtool-bar { max-width: 980px; margin: 0 auto 6px; display: flex; align-items: center; gap: 12px; }
    .backbtn {
      background: transparent; border: 1px solid var(--border-mid); border-radius: 8px;
      padding: 7px 13px; color: var(--text-secondary); font-family: inherit; font-size: 12px;
      cursor: pointer; transition: border-color .12s, color .12s;
    }
    .backbtn:hover { border-color: var(--ws-color); color: var(--text-primary); }
    .subtool-tag { font-size: 11px; color: var(--text-muted); letter-spacing: .04em; }

    .tool-content { max-width: 860px; margin: 0 auto; }
    .ha-eyebrow {
      font-size: 11px; font-weight: 600; letter-spacing: .1em;
      text-transform: uppercase; color: var(--ws-color, var(--admin-color));
      margin-bottom: 6px;
    }
    .ha-title { font-size: 22px; font-weight: 600; letter-spacing: -.3px; }

    .pd-outer { max-width: 960px; }
    .pd-header-row { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 20px; }
    .pd-clear-btn {
      padding: 6px 13px; border-radius: 6px; border: 1px solid var(--border-mid);
      background: transparent; color: var(--text-secondary);
      font-size: 11.5px; cursor: pointer; font-family: inherit;
      transition: border-color .15s, color .15s;
    }
    .pd-clear-btn:hover { border-color: var(--border-bright); color: var(--text-primary); }

    /* Drop zone */
    .pd-dropzone {
      display: flex; flex-direction: column; align-items: center;
      gap: 13px; padding: 56px 32px;
      border: 1.5px dashed var(--border-bright);
      border-radius: 14px; background: var(--bg-surface);
      transition: border-color .2s, background .2s; text-align: center;
    }
    .pd-dropzone.pd-drop-active { border-color: var(--ws-color, var(--admin-color)); background: var(--ws-sub, var(--admin-sub)); }
    .pd-drop-icon { color: var(--text-muted); }
    .pd-drop-icon svg { width: 40px; height: 40px; }
    .pd-drop-title { font-size: 16px; font-weight: 600; }
    .pd-drop-sub { font-size: 13px; color: var(--text-secondary); }
    .pd-drop-sub code {
      font-family: 'JetBrains Mono', monospace; font-size: 11px;
      background: var(--bg-elevated); border: 1px solid var(--border-mid);
      border-radius: 3px; padding: 1px 5px; color: var(--text-secondary);
    }
    .pd-drop-btn {
      padding: 9px 22px; border-radius: 8px; background: var(--ws-color, var(--admin-color)); color: #fff;
      font-size: 13px; font-weight: 500; cursor: pointer; transition: opacity .15s; display: inline-block;
    }
    .pd-drop-btn:hover { opacity: .85; }

    /* Deep Research form */
    .dr-query-block { margin-bottom: 30px; }
    .dr-label {
      display: block; font-size: 11px; font-weight: 600; letter-spacing: .5px;
      text-transform: uppercase; color: var(--text-muted); margin-bottom: 8px;
    }
    .dr-textarea {
      width: 100%; box-sizing: border-box; resize: vertical;
      padding: 14px 16px; border-radius: 10px;
      background: var(--bg-surface); border: 1.5px solid var(--border-mid);
      color: var(--text-primary); font-family: inherit; font-size: 14px; line-height: 1.6;
      transition: border-color .15s, box-shadow .15s;
    }
    .dr-textarea::placeholder { color: var(--text-muted); }
    .dr-textarea:focus { outline: none; border-color: var(--ws-color, var(--admin-color)); box-shadow: 0 0 0 3px var(--ws-sub, var(--admin-sub)); }
    .dr-textarea-err { border-color: #ff5555 !important; box-shadow: 0 0 0 3px rgba(255,85,85,.15) !important; }
    .dr-chips { display: flex; gap: 10px; flex-wrap: wrap; }
    .dr-chip {
      flex: 1 1 0; min-width: 120px; text-align: left; cursor: pointer;
      padding: 11px 14px; border-radius: 10px;
      background: var(--bg-surface); border: 1.5px solid var(--border-mid);
      color: var(--text-secondary); font-family: inherit;
      transition: border-color .15s, background .15s, color .15s;
    }
    .dr-chip:hover { border-color: var(--border-bright); }
    .dr-chip.active { border-color: var(--ws-color, var(--admin-color)); background: var(--ws-sub, var(--admin-sub)); color: var(--text-primary); }
    .dr-chip-label { display: block; font-size: 13px; font-weight: 600; }
    .dr-chip-sub { display: block; font-size: 11px; color: var(--text-muted); margin-top: 2px; }
    .dr-run-btn {
      margin-top: 22px; padding: 11px 26px; border-radius: 9px; border: none;
      background: var(--ws-color, var(--admin-color)); color: #fff;
      font-size: 14px; font-weight: 600; cursor: pointer; font-family: inherit; transition: opacity .15s;
    }
    .dr-run-btn:hover { opacity: .88; }
    .dr-run-note { font-size: 11.5px; color: var(--text-muted); margin-top: 10px; }
    .dr-attach-head { margin-bottom: 12px; }
    .dr-attach-title { font-size: 14px; font-weight: 600; color: var(--text-primary); }
    .dr-attach-sub { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }
    .dr-filelist { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 14px; }
    .dr-file-tag {
      display: inline-flex; align-items: center; gap: 7px;
      padding: 5px 10px; border-radius: 7px; font-size: 11.5px;
      background: var(--bg-elevated); border: 1px solid var(--border-mid); color: var(--text-secondary);
    }
    .dr-file-tag button { border: none; background: none; color: var(--text-muted); cursor: pointer; font-size: 12px; padding: 0; line-height: 1; }
    .dr-file-tag button:hover { color: #ff8888; }
    .dr-run-row { display: flex; gap: 10px; align-items: center; margin-top: 22px; flex-wrap: wrap; }
    .dr-run-row .dr-run-btn { margin-top: 0; }
    .dr-run-secondary { background: var(--bg-elevated); color: var(--text-secondary); border: 1px solid var(--border-mid); }
    .dr-run-secondary:hover { opacity: 1; border-color: var(--border-bright); color: var(--text-primary); }
    /* clarify */
    .dr-clar-head { font-size: 15px; font-weight: 600; }
    .dr-clar-sub { font-size: 12.5px; color: var(--text-secondary); margin: 4px 0 16px; }
    .dr-clar-q { margin-bottom: 14px; }
    /* sources panel */
    .dr-src-panel { margin-top: 26px; border: 1px solid var(--border-dim); border-radius: 12px; overflow: hidden; }
    .dr-src-head {
      width: 100%; display: flex; justify-content: space-between; align-items: center;
      padding: 12px 16px; background: var(--bg-surface); border: none; cursor: pointer;
      color: var(--text-primary); font-family: inherit; font-size: 13px; font-weight: 600;
    }
    .dr-src-head:hover { background: var(--bg-elevated); }
    .dr-src-count { font-size: 11.5px; color: var(--text-muted); font-weight: 400; }
    .dr-src-body { padding: 14px 16px; border-top: 1px solid var(--border-dim); }
    .dr-src-loading { color: var(--text-muted); font-size: 12.5px; }
    .dr-src-table { width: 100%; border-collapse: collapse; font-size: 12px; }
    .dr-src-table th {
      text-align: left; font-size: 10.5px; text-transform: uppercase; letter-spacing: .4px;
      color: var(--text-muted); font-weight: 600; padding: 4px 6px;
    }
    .dr-src-table td { padding: 4px 6px; }
    .dr-src-desc-td { width: 24%; }
    .dr-src-surl-td { width: 20%; }
    .dr-src-desc { font-size: 11.5px; }
    .dr-src-in {
      width: 100%; box-sizing: border-box; padding: 6px 8px; border-radius: 6px;
      background: var(--bg-elevated); border: 1px solid var(--border-mid);
      color: var(--text-primary); font-family: inherit; font-size: 12px;
    }
    .dr-src-in:focus { outline: none; border-color: var(--admin-color); }
    .dr-src-del { border: none; background: none; color: var(--text-muted); cursor: pointer; font-size: 13px; }
    .dr-src-del:hover { color: #ff8888; }
    .dr-src-actions { display: flex; gap: 10px; align-items: center; margin-top: 12px; }
    .dr-src-btn {
      padding: 7px 14px; border-radius: 7px; border: 1px solid var(--border-mid);
      background: var(--bg-elevated); color: var(--text-secondary);
      font-family: inherit; font-size: 12px; cursor: pointer;
    }
    .dr-src-btn:hover { border-color: var(--border-bright); color: var(--text-primary); }
    .dr-src-save { background: var(--admin-color); color: #fff; border-color: var(--admin-color); }
    .dr-src-msg { font-size: 11.5px; }
    .dr-src-note { font-size: 11px; color: var(--text-muted); margin-top: 10px; }
    .dr-src-hosted-note {
      font-size: 12px; line-height: 1.5; color: #e0b341;
      background: rgba(224,179,65,.08); border: 1px solid #7a6320;
      border-radius: 8px; padding: 10px 13px; margin-bottom: 14px;
    }
    .dr-src-hosted-note strong { color: #f0c869; }
    /* unified list: the dot IS the login flag */
    .dr-src-table-simple th:first-child, .dr-src-dot-td { width: 28px; text-align: center; }
    .dr-src-url { font-family: ui-monospace, monospace; }
    .dr-dot {
      width: 13px; height: 13px; border-radius: 50%; border: 1px solid rgba(0,0,0,.35);
      cursor: pointer; padding: 0; vertical-align: middle; transition: transform .12s, box-shadow .12s;
    }
    .dr-dot:hover { transform: scale(1.25); }
    .dr-dot:focus-visible { outline: 2px solid var(--admin-color); outline-offset: 2px; }
    .dr-dot.green { background: #22c55e; box-shadow: 0 0 6px rgba(34,197,94,.55); }
    .dr-dot.red   { background: #ef4444; box-shadow: 0 0 6px rgba(239,68,68,.55); }
    .dr-dot.grey  { background: #6b7280; }
    .dr-src-publish { border-color: var(--admin-color); color: var(--admin-color); }
    .dr-src-publish:hover { background: rgba(84,255,120,.10); }
    .dr-src-publish:disabled { opacity: .6; cursor: default; }
    /* source-access probe results */
    .dr-probe-note { font-size: 12px; color: var(--text-muted); margin: 10px 0; }
    .dr-probe-box { margin: 12px 0 4px; border: 1px solid var(--border-dim); border-radius: 8px; overflow: hidden; }
    .dr-probe-head { font-size: 12.5px; color: var(--text-secondary); padding: 9px 12px; background: var(--bg-surface); border-bottom: 1px solid var(--border-dim); }
    .dr-probe-head strong { color: var(--text-primary); }
    .dr-probe-row { display: flex; justify-content: space-between; gap: 12px; padding: 6px 12px; font-size: 12.5px; border-bottom: 1px solid var(--border-dim); }
    .dr-probe-row:last-child { border-bottom: 0; }
    .dr-probe-dom { font-family: ui-monospace, monospace; color: var(--text-secondary); }
    .dr-probe-row.ok .dr-probe-v { color: #4ade80; }
    .dr-probe-row.no .dr-probe-v { color: #ff9d6b; }
    .dr-probe-row.err .dr-probe-v { color: var(--text-muted); }
    /* Stage-4 credential panel */
    .dr-cred-list { margin: 6px 0 4px; }
    .dr-cred-row { display: flex; gap: 14px; align-items: flex-start; padding: 12px 0; border-bottom: 1px solid var(--border-dim); }
    .dr-cred-row:last-child { border-bottom: none; }
    .dr-cred-site { flex: 0 0 180px; min-width: 0; }
    .dr-cred-domain { font-size: 13px; font-weight: 600; color: var(--text-primary); word-break: break-all; }
    .dr-cred-reason { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
    .dr-cred-fields { flex: 1 1 auto; display: flex; flex-direction: column; gap: 7px; }
    /* per-source login lock in the Sources table */
    .dr-lock { border:none; background:none; cursor:pointer; font-size:14px; padding:2px 4px; border-radius:5px; opacity:.65; }
    .dr-lock:hover { opacity:1; background:var(--bg-elevated); }
    .dr-lock.on { opacity:1; }
    .dr-lock-na { color:var(--text-muted); }
    .dr-cred-edit-row td { padding: 0 6px 10px; }
    .dr-cred-edit { background: var(--bg-surface); border: 1px solid var(--border-mid); border-radius: 8px; padding: 12px; display: flex; flex-direction: column; gap: 7px; }
    .dr-cred-edit-title { font-size: 12px; color: var(--text-secondary); }
    /* skip-this-stage button */
    .dr-skip-btn {
      margin-top: 16px; padding: 8px 18px; border-radius: 8px;
      background: var(--bg-elevated); color: var(--text-secondary);
      border: 1px solid var(--border-mid); font-family: inherit; font-size: 12.5px; cursor: pointer;
      transition: border-color .15s, color .15s;
    }
    .dr-skip-btn:hover { border-color: var(--border-bright); color: var(--text-primary); }
    .dr-skip-note { margin-top: 16px; font-size: 12px; color: var(--text-muted); }
    /* stop control + two-choice panel */
    .dr-run-controls { margin-top: 16px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .dr-run-controls .dr-skip-btn { margin-top: 0; }
    .dr-stop-btn {
      padding: 8px 18px; border-radius: 8px; background: rgba(255,107,107,.12);
      color: #ff8f8f; border: 1px solid #7a2e2e; font-family: inherit; font-size: 12.5px;
      cursor: pointer; transition: border-color .15s, color .15s, background .15s;
    }
    .dr-stop-btn:hover { border-color: #ff6b6b; color: #ffb3b3; background: rgba(255,107,107,.2); }
    .dr-stop-panel {
      margin-top: 18px; padding: 16px 18px; border-radius: 12px;
      background: var(--bg-surface); border: 1px solid var(--border-mid);
    }
    .dr-stop-q { font-size: 13.5px; font-weight: 600; color: var(--text-primary); margin-bottom: 12px; }
    .dr-stop-actions { display: flex; gap: 10px; flex-wrap: wrap; }
    .dr-stop-note { margin-top: 16px; font-size: 12.5px; color: var(--ws-color, var(--admin-color)); }
    /* Claude-refusal → local-model fall-over panel */
    .dr-refusal-panel {
      margin-top: 8px; padding: 18px 20px; border-radius: 12px;
      background: rgba(224,179,65,.07); border: 1px solid #7a6320;
    }
    .dr-refusal-head { font-size: 14.5px; font-weight: 600; color: #e0b341; }
    .dr-refusal-cat { font-size: 12px; color: var(--text-secondary); margin: 4px 0 14px; }
    .dr-refusal-confirm { font-size: 13.5px; color: var(--text-primary); margin-bottom: 4px; }
    .dr-refusal-sub { font-size: 12.5px; color: var(--text-secondary); margin-bottom: 14px; }
    /* refine box */
    .dr-refine-box { margin-top: 26px; padding: 16px 18px; border-radius: 12px; background: var(--bg-surface); border: 1px solid var(--border-dim); }
    .dr-refine-head { font-size: 14px; font-weight: 600; color: var(--text-primary); }
    .dr-refine-sub { font-size: 12px; color: var(--text-secondary); margin: 3px 0 12px; }
    /* research-channel toggles */
    .dr-toggle-row { display: flex; gap: 10px; flex-wrap: wrap; }
    .dr-toggle {
      display: flex; align-items: flex-start; gap: 10px; flex: 1 1 160px; min-width: 160px;
      padding: 11px 13px; border-radius: 10px; cursor: pointer;
      background: var(--bg-surface); border: 1px solid var(--border-dim);
      transition: border-color .15s, opacity .15s;
    }
    .dr-toggle.off { opacity: .55; }
    .dr-toggle:hover { border-color: var(--border-bright); }
    .dr-toggle input { display: none; }
    .dr-toggle-sw { flex: 0 0 auto; margin-top: 2px; width: 34px; height: 19px; border-radius: 999px; background: var(--border-mid); position: relative; transition: background .15s; }
    .dr-toggle-sw::after { content: ''; position: absolute; top: 2px; left: 2px; width: 15px; height: 15px; border-radius: 50%; background: #fff; transition: transform .15s; }
    .dr-toggle.on .dr-toggle-sw { background: var(--admin-color); }
    .dr-toggle.on .dr-toggle-sw::after { transform: translateX(15px); }
    .dr-toggle-txt { display: flex; flex-direction: column; gap: 1px; }
    .dr-toggle-label { font-size: 12.5px; font-weight: 600; color: var(--text-primary); }
    .dr-toggle-sub { font-size: 10.5px; color: var(--text-muted); }
    /* "Go deeper?" CTA + panel */
    .dr-deeper-cta {
      margin-top: 26px; padding: 16px 18px; border-radius: 12px;
      background: var(--bg-surface); border: 1px solid var(--border-dim);
      display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap;
    }
    .dr-deeper-cta-title { font-size: 14px; font-weight: 600; color: var(--text-primary); }
    .dr-deeper-cta-sub { font-size: 12px; color: var(--text-secondary); margin-top: 3px; max-width: 560px; }
    .dr-deeper-box { margin-top: 26px; padding: 18px 20px; border-radius: 12px; background: var(--bg-surface); border: 1px solid var(--border-dim); }
    .dr-deeper-box .dr-drop-compact { margin: 10px 0 0; max-width: none; }
    .dr-file-memo { background: var(--admin-color); color: #fff; border-color: var(--admin-color); }
    /* compact supporting-docs dropzone */
    .dr-drop-compact { padding: 22px 24px; gap: 8px; border-radius: 12px; max-width: 560px; margin: 0 auto; }
    .dr-drop-compact .pd-drop-icon svg { width: 26px; height: 26px; }
    .dr-drop-compact .pd-drop-title { font-size: 13.5px; }

    /* spinner */
    @keyframes pdSpin { to { transform: rotate(360deg); } }
    .pd-spinner {
      width: 28px; height: 28px; border-radius: 50%;
      border: 2.5px solid var(--border-bright); border-top-color: var(--ws-color, var(--admin-color));
      animation: pdSpin .75s linear infinite; flex-shrink: 0; margin: 0 auto;
    }

    /* report (rendered markdown) */
    .vc-memo-outer { max-width: 860px; margin: 0 auto; }
    .vc-memo-toolbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; gap: 10px; flex-wrap: wrap; }
    .vc-memo-files { font-size: 11.5px; color: var(--text-muted); flex: 1; line-height: 1.5; }
    .vc-memo-download {
      padding: 7px 16px; border-radius: 7px; background: var(--ws-color, var(--admin-color)); color: #fff;

<script>
"use strict";
/* ── Standalone scaffolding (shims for what the old SPA shell provided) ─────── */
const PERF_SERVER = '';                 // same origin — this server serves the page AND the API
const PERF_WAIT_SEC = 20;
const activeTool = 'deepResearch';

function _esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
async function _pdAlive() {
  try { const r = await fetch(`${PERF_SERVER}/api/health`, { cache: 'no-store' }); return r.ok; }
  catch (_) { return false; }
}
function _pdFireProtocol() { /* standalone: the server is already running (it served this page) */ }
function renderContent() { _drRender(); }   // single-tool dispatcher

/* ── Save a generated .docx to the reports folder + open it in Word (server-side),
   with a browser-download fallback if the save endpoint fails ─────────────────── */
function _blobDownload(b64, name) {
  const bytes = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
  const blob = new Blob([bytes], { type: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}
function _toast(msg, ok) {
  let t = document.getElementById('dr-toast');
  if (!t) {
    t = document.createElement('div'); t.id = 'dr-toast';
    t.style.cssText = 'position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:10000;max-width:82vw;' +
      'padding:10px 16px;border-radius:8px;font-size:12.5px;font-family:inherit;border:1px solid var(--border-bright);' +
      'background:var(--bg-elevated);color:var(--text-primary);box-shadow:0 0 14px rgba(52,210,79,.3);' +
      'white-space:pre-wrap;text-align:center;transition:opacity .4s';
    document.body.appendChild(t);
  }
  t.style.borderColor = (ok === false) ? '#ff6b6b' : 'var(--ws-color)';
  t.textContent = msg; t.style.opacity = '1';
  clearTimeout(t._h); t._h = setTimeout(() => { t.style.opacity = '0'; }, 6000);
}
function _savedBadge(path) {
  // Shown when the server auto-saved the report to the reports folder on completion.
  if (!path) return '';
  const fname = String(path).split('\\').pop();
  return ` &nbsp;·&nbsp; <span style="color:var(--text-muted)" title="Auto-saved on completion to ${_esc(path)}">💾 auto-saved: ${_esc(fname)}</span>`;
}
async function saveAndOpen(docx_b64, query, label, fallbackName, title) {
  if (!docx_b64) return;
  if (title) fallbackName = `${title} — ${new Date().toISOString().slice(0, 10)}.docx`;
  _toast('Saving & opening in Word…');
  try {
    const r = await fetch(`${PERF_SERVER}/api/save_report`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ docx_b64, query, label, title: title || '' }) });
    const j = await r.json();
    if (!r.ok || !j.ok) throw new Error(j.error || ('save failed (' + r.status + ')'));
    if (j.opened) {
      _toast('✓ Saved & opened in Word:\n' + j.path);
    } else {
      // Server saved but can't launch Word for you (hosted/headless box, or Word
      // missing) → hand the document to the browser so it opens HERE.
      _blobDownload(docx_b64, fallbackName);
      _toast('✓ Saved on the server — downloading the document to open here:\n' + fallbackName);
    }
  } catch (e) {
    _blobDownload(docx_b64, fallbackName);
    _toast('Could not save to the reports folder (' + e.message + ').\nDownloaded via the browser instead.', false);
  }
}

/* ════════════════════════════════════════════════════════════════════════════
   LIVE ACTIVITY FEED — global right-side panel streaming raw engine activity
   for the running job (DR / Odysseus). Wired into the existing polling
   loops via ?after=<seq> on the status endpoints. One job "owns" the feed at a
   time; a new run clears it. Hidden until a run first produces events.
   ════════════════════════════════════════════════════════════════════════════ */
const _act = { owner: null, lastSeq: 0, lines: 0, everShown: false, collapsed: false };
try { _act.collapsed = localStorage.getItem('drActCollapsed') === '1'; } catch (_) {}

const ACT_KINDS = {
  search:  { g: '⌕', cls: 'ak-search' },
  open:    { g: '▸', cls: 'ak-open' },
  note:    { g: '◆', cls: 'ak-note' },
  ext:     { g: '+', cls: 'ak-ext' },
  forum:   { g: '☗', cls: 'ak-forum' },
  stage:   { g: '⚑', cls: 'ak-stage' },
  login:   { g: '🔑', cls: 'ak-login' },
  plan:    { g: '≡', cls: 'ak-plan' },
  ody:     { g: '~', cls: 'ak-ody' },
  act:     { g: '→', cls: 'ak-open' },     // every tool call as it fires
  hit:     { g: '·', cls: 'ak-log' },      // search results cascading by
  turn:    { g: '…', cls: 'ak-log' },      // agent weighing its next move
  extract: { g: '⚙', cls: 'ak-search' },   // per-page extraction verdicts
  synth:   { g: '✎', cls: 'ak-forum' },    // synthesis / meta-organization
  docs:    { g: '▤', cls: 'ak-forum' },    // uploaded-document intake analysis
  lane:    { g: '⫽', cls: 'ak-plan' },     // parallel lanes: planning / lead review / hot trail
  log:     { g: '·', cls: 'ak-log' },
};

function _actApplyVis() {
  const p = document.getElementById('act-panel');
  const t = document.getElementById('act-tab');
  if (!p || !t) return;
  if (!_act.everShown) { p.classList.add('hidden'); t.classList.add('hidden'); return; }
  p.classList.toggle('hidden', _act.collapsed);
  t.classList.toggle('hidden', !_act.collapsed);
}
function actToggle() {
  _act.collapsed = !_act.collapsed;
  try { localStorage.setItem('drActCollapsed', _act.collapsed ? '1' : '0'); } catch (_) {}
  _actApplyVis();
  if (!_act.collapsed) { const b = document.getElementById('act-body'); if (b) b.scrollTop = b.scrollHeight; }
}
function actStartRun(owner) {
  // A new run takes over the feed and clears it.
  _act.owner = owner; _act.lastSeq = 0; _act.lines = 0;
  const b = document.getElementById('act-body'); if (b) b.innerHTML = '';
  const c = document.getElementById('act-count'); if (c) c.textContent = '0';
}
function actIngest(owner, st) {
  // Feed one status-poll response into the panel (only from the owning job).
  if (!st || _act.owner !== owner) return;
  if (Array.isArray(st.events) && st.events.length) actAppend(st.events);
  if (typeof st.eseq === 'number' && st.eseq > _act.lastSeq) _act.lastSeq = st.eseq;
}
function actAppend(events) {
  const body = document.getElementById('act-body');
  if (!body || !events || !events.length) return;
  // classic chat-log behavior: stick to the bottom unless the user scrolled up
  const nearBottom = (body.scrollHeight - body.scrollTop - body.clientHeight) < 48;
  const frag = document.createDocumentFragment();
  for (const ev of events) {
    const seq = ev[0], kind = ev[1] || 'log', raw = String(ev[2] == null ? '' : ev[2]);
    if (typeof seq === 'number' && seq <= _act.lastSeq) continue;   // dedupe overlap
    if (typeof seq === 'number') _act.lastSeq = seq;
    const k = ACT_KINDS[kind] || ACT_KINDS.log;
    const row = document.createElement('div');
    row.className = 'act-line ' + k.cls;
    const txt = raw.replace(/^\s*\[[a-z_\- ]+\]\s*/i, '');          // strip "[xxx] " prefix
    row.innerHTML = `<span class="act-g">${k.g}</span>${_esc(txt)}`;
    frag.appendChild(row);
    _act.lines++;
  }
  if (!frag.childNodes.length) return;
  body.appendChild(frag);
  while (body.childNodes.length > 1500) body.removeChild(body.firstChild);   // DOM cap
  const c = document.getElementById('act-count');
  if (c) c.textContent = String(_act.lines);
  if (nearBottom) body.scrollTop = body.scrollHeight;
  if (!_act.everShown) { _act.everShown = true; }
  _actApplyVis();
}
function _actAfter(owner) {
  // ?after= value for a status poll: incremental for the owning job, 0 otherwise.
  return _act.owner === owner ? _act.lastSeq : 0;
}

/* ════════════════════════════════════════════════════════════════════════════
   DEEP RESEARCH — UI (lifted verbatim from the original platform)
   ════════════════════════════════════════════════════════════════════════════ */
  const _dr = { data: null, abort: null, gen: 0, query: '', depth: 'standard', files: [],
                clarify: null, clarAns: {}, sources: null, srcOpen: false,
                provider: 'claude', localModel: null, localErr: false,
                deeperOpen: false, deeperFiles: [], deeperQuery: '',
                extractOpen: false, extractUrl: '', extractMode: 'scrape', extractLimit: 25,
                extractBusy: false, extractResult: null, extractError: null,
                extractMsg: '', extractPct: null, _extractGen: 0,
                channels: { api_search: true, web_engines: true, site_queries: true, neural_search: true },
                prefs: { open: false, loaded: false, prompt: '', name: '', status: '' } };

  function drReset() {
    if (_dr.abort) { try { _dr.abort.abort(); } catch (_) {} _dr.abort = null; }
    _dr.gen++;
    _dr.data = null;
    _dr.files = [];
    _dr.credShown = false;
    _dr.credInputs = {};
    _dr.skipReqStage = null;
    _dr.stopPrompt = false; _dr.stopChoice = false;
    _dr.refusalShown = false; _dr.refusalResolved = null; _dr.refusalLocal = null; _dr.refusalDetails = null;
    _dr.deeperOpen = false;
    _dr.deeperFiles = [];
    _dr.deeperQuery = '';
    _dr.extractOpen = false;
    _dr.extractUrl = '';
    _dr.extractResult = null;
    _dr.extractError = null;
    _dr.extractBusy = false;
    _dr._extractGen++;
  }

  function _drRender() {
    const main = document.getElementById('ws-main-inner');
    const d = _dr.data;
    main.innerHTML = `
      <div class="tool-content pd-outer">
        <div class="pd-header-row">
          <div>
            <div class="ha-eyebrow">Web Research</div>
            <div class="ha-title">Deep Research</div>
          </div>
          <div style="display:flex;gap:12px;flex-wrap:wrap;align-items:center">
            ${_drProviderSwitch()}
            <button class="pd-clear-btn" onclick="drTogglePrefs()" title="Edit the editorial guidelines (prompts/deep_research.md)">⚙ Preferences</button>
            ${d ? `<button class="pd-clear-btn" onclick="drClear()">✕ Clear</button>` : ''}
          </div>
        </div>
        ${_drPrefsHtml()}
        ${d ? _drResultsHtml() : _drForm()}
      </div>`;
  }

  function _drProviderSwitch() {
    const p = _dr.provider || 'claude';
    const on = 'background:var(--admin-color,#7CFF9B);color:#04120a;font-weight:600';
    const off = 'background:transparent;color:var(--text-secondary)';
    const seg = (id, label) => `<button onclick="drSetProvider('${id}')" style="border:none;padding:5px 12px;font:inherit;font-size:12px;cursor:pointer;border-radius:6px;${p === id ? on : off}">${label}</button>`;
    let note = '';
    if (p === 'local') {
      if (_dr.localModel) note = `<span style="font-size:11px;color:var(--text-muted)" title="Model loaded in LM Studio">▸ ${_esc(_dr.localModel)}</span>`;
      else if (_dr.localErr) note = `<span style="font-size:11px;color:#ff8888">⚠ LM Studio not connected</span>`;
      else note = `<span style="font-size:11px;color:var(--text-muted)">checking…</span>`;
    }
    return `<div style="display:flex;align-items:center;gap:10px"
        title="Local AI routes every AI call to the model loaded in LM Studio — Claude is fully out of the loop for the run.">
      <div style="display:flex;gap:2px;padding:3px;border:1px solid var(--border-mid);border-radius:8px;background:var(--bg-surface)">${seg('claude', 'Claude')}${seg('local', 'Local AI')}</div>
      ${note}</div>`;
  }
  function drSetProvider(p) {
    _dr.provider = p;
    if (p === 'local') {
      _dr.localModel = null; _dr.localErr = false; _drRender();
      fetch(`${PERF_SERVER}/api/deep_research/local_model`).then(r => r.json()).then(j => {
        if (j.ok) { _dr.localModel = j.model; _dr.localErr = false; }
        else { _dr.localModel = null; _dr.localErr = true; }
        if (_dr.provider === 'local') _drRender();
      }).catch(() => { _dr.localErr = true; if (_dr.provider === 'local') _drRender(); });
    } else { _drRender(); }
  }

  function _drPrefsSection() {
    const open = _dr.prefs.open;
    return `
      <div style="margin-top:18px;text-align:center">
        <button onclick="drTogglePrefs()" style="background:none;border:1px solid var(--border-mid);
          color:var(--text-secondary);border-radius:8px;padding:7px 14px;font-size:12px;cursor:pointer">
          ⚙ ${open ? 'Hide' : 'Edit'} research prompt</button>
      </div>
      ${_drPrefsHtml()}`;
  }

  function _drPrefsHtml() {
    const p = _dr.prefs;
    if (!p.open) return '';
    if (!p.loaded) {
      return `<div style="margin-top:14px;text-align:center">
        <div class="pd-spinner" style="margin:8px auto"></div>
        <div style="color:var(--text-muted);font-size:12px">${_esc(p.status || 'Loading prompt…')}</div></div>`;
    }
    const ta = 'width:100%;height:340px;font-family:\'JetBrains Mono\',monospace;font-size:11.5px;line-height:1.5;' +
               'background:var(--bg-surface);border:1px solid var(--border-mid);border-radius:8px;padding:12px;' +
               'color:var(--text-secondary);resize:vertical;box-sizing:border-box';
    return `
      <div style="margin-top:14px;border:1px solid var(--border-mid);border-radius:10px;padding:16px 18px;
           background:var(--bg-elevated);text-align:left">
        <div style="font-size:12px;color:var(--text-muted);margin-bottom:14px;line-height:1.6">
          This is the governing prompt for Deep Research (Part 1 search strategy · Part 2 output
          framework). Saving writes the file on the server and it's used by <strong>all future runs
          immediately</strong> — no restart. A <code>.bak</code> of the previous version is kept.</div>
        <label class="dr-label">Research prompt <span style="color:var(--text-muted);font-weight:400">— ${_esc(p.name || 'deep_research.md')}</span></label>
        <textarea style="${ta}" oninput="_dr.prefs.prompt=this.value;_dr.prefs.status=''">${_esc(p.prompt)}</textarea>
        <div style="display:flex;gap:10px;align-items:center;margin-top:14px;flex-wrap:wrap">
          <button class="dr-run-btn" onclick="drSavePrompt()">Save prompt</button>
          <button class="dr-run-btn dr-run-secondary" onclick="drTogglePrefs()">Close</button>
          <span style="font-size:11.5px;color:var(--admin-color)">${_esc(p.status || '')}</span>
        </div>
      </div>`;
  }

  async function drTogglePrefs() {
    _dr.prefs.open = !_dr.prefs.open;
    if (_dr.prefs.open && !_dr.prefs.loaded) {
      _dr.prefs.status = 'Loading prompt…';
      _drRender();
      let alive = await _pdAlive();
      if (!alive) { _pdFireProtocol();
        for (let i = 0; i < Math.ceil(PERF_WAIT_SEC / 1.5); i++) { await new Promise(r => setTimeout(r, 1500)); if (await _pdAlive()) { alive = true; break; } } }
      if (!alive) { _dr.prefs.status = 'Could not reach the local server. Start it, then reopen.'; _drRender(); return; }
      try {
        const r = await fetch(`${PERF_SERVER}/api/deep_research/prompt`);
        const j = await r.json();
        if (!r.ok) throw new Error(j.error || `Server error ${r.status}`);
        _dr.prefs.prompt = j.prompt || ''; _dr.prefs.name = j.name || '';
        _dr.prefs.loaded = true; _dr.prefs.status = '';
      } catch (e) {
        _dr.prefs.status = 'Could not load prompt: ' + e.message; _dr.prefs.loaded = true;
      }
    }
    _drRender();
  }

  async function drSavePrompt() {
    _dr.prefs.status = 'Saving…'; _drRender();
    try {
      const r = await fetch(`${PERF_SERVER}/api/deep_research/prompt`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ prompt: _dr.prefs.prompt }) });
      const j = await r.json();
      if (!r.ok) throw new Error(j.error || `Server error ${r.status}`);
      _dr.prefs.status = j.saved === false ? 'Nothing saved (prompt was blank).' : '✓ Saved — applies to all future runs.';
    } catch (e) {
      _dr.prefs.status = 'Save failed: ' + e.message;
    }
    _drRender();
  }

  function _drForm() {
    const depths = [
      { id:'standard', label:'Standard', sub:'best outcome in ~5 min' },
      { id:'deep',     label:'Deep',     sub:'best outcome in ~10 min' },
      { id:'exhaustive', label:'1 hour', sub:'free-roam lanes until exhausted or 60 min' },
      { id:'odysseus', label:'Deep + Odysseus', sub:'headless pre-research → deep run' },
    ];
    const chips = depths.map(o => `
      <button type="button" class="dr-chip ${_dr.depth === o.id ? 'active' : ''}"
              onclick="drSetDepth('${o.id}')">
        <span class="dr-chip-label">${o.label}</span>
        <span class="dr-chip-sub">${o.sub}</span>
      </button>`).join('');
    const fileList = _dr.files.length
      ? `<div class="dr-filelist">${_dr.files.map((f,i) =>
          `<span class="dr-file-tag">${_esc(f.name)}<button onclick="drRemoveFile(${i})" title="Remove">✕</button></span>`).join('')}</div>`
      : '';
    return `
      <div class="dr-query-block">
        <label class="dr-label">Research question</label>
        <textarea id="dr-query" class="dr-textarea" rows="3"
          placeholder=""
          oninput="_dr.query = this.value">${_esc(_dr.query)}</textarea>

        <label class="dr-label" style="margin-top:18px">Depth</label>
        <div class="dr-chips">${chips}</div>

        ${_drChannelsHtml()}

        <div class="dr-run-row">
          <button class="dr-run-btn" onclick="drRun(false)">Run Deep Research →</button>
          <button class="dr-run-btn dr-run-secondary" onclick="drRun(true)"
                  title="Skip the clarifying questions and research as written">No questions</button>
        </div>
        <div class="dr-run-note">Opens a visible Chrome and searches the web live. Unless you click “No questions,” it may ask 1–3 quick scoping questions first.</div>
      </div>

      ${_drSourcesPanel()}

      <div class="dr-attach-head" style="margin-top:30px">
        <div class="dr-attach-title">Supporting documents <span style="color:var(--text-muted);font-weight:400">(optional)</span></div>
        <div class="dr-attach-sub">Drop documents, PDFs, decks, web pages, or notes to ground the research in your own material.</div>
      </div>
      <div class="pd-dropzone dr-drop-compact" id="dr-drop"
           ondragover="event.preventDefault();this.classList.add('pd-drop-active')"
           ondragleave="this.classList.remove('pd-drop-active')"
           ondrop="drHandleDrop(event)">
        <div class="pd-drop-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
               stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/>
          </svg>
        </div>
        <div class="pd-drop-title">Drag &amp; drop supporting files</div>
        <div class="pd-drop-sub">PDF, Excel, Word, PowerPoint, text — any document</div>
        <label class="pd-drop-btn" style="background:var(--ws-color, var(--admin-color))">
          Browse files
          <input type="file" multiple style="display:none" onchange="drHandleFile(this)">
        </label>
        ${fileList}
      </div>`;
  }

  function drSetDepth(id) { _dr.depth = id; _drRender(); }

  function _drChannelsHtml() {
    const items = [
      { k:'api_search',    label:'Baseline sweep',     sub:'fast broad browser search · no page opens' },
      { k:'web_engines',   label:'Open web engines',   sub:'DuckDuckGo · Brave · Google' },
      { k:'site_queries',  label:'Curated sites',      sub:'your forum / blog source list + logins' },
      { k:'neural_search', label:'API discovery',      sub:'Tavily · Exa · Bright Data fallbacks' },
    ];
    const rows = items.map(it => `
      <label class="dr-toggle ${_dr.channels[it.k] ? 'on' : 'off'}">
        <input type="checkbox" ${_dr.channels[it.k] ? 'checked' : ''}
               onchange="drToggleChannel('${it.k}', this.checked)">
        <span class="dr-toggle-sw"></span>
        <span class="dr-toggle-txt">
          <span class="dr-toggle-label">${it.label}</span>
          <span class="dr-toggle-sub">${it.sub}</span>
        </span>
      </label>`).join('');
    const allOff = !Object.values(_dr.channels).some(Boolean);
    return `
      <label class="dr-label" style="margin-top:18px">Research channels</label>
      <div class="dr-toggle-row">${rows}</div>
      <div class="dr-run-note" style="margin-top:6px">
        Off = that channel is skipped entirely. On = the planner decides how hard to use it.
        ${allOff ? '<span style="color:#ff8888"> — all channels are off; the run will have nothing to search.</span>' : ''}
      </div>`;
  }
  function drToggleChannel(k, v) { _dr.channels[k] = v; _drRender(); }

  function drHandleDrop(e) {
    e.preventDefault();
    document.getElementById('dr-drop')?.classList.remove('pd-drop-active');
    const files = Array.from(e.dataTransfer.files);
    if (files.length) { _dr.files = _dr.files.concat(files); _drRender(); }
  }
  function drHandleFile(input) {
    const files = Array.from(input.files);
    if (files.length) { _dr.files = _dr.files.concat(files); _drRender(); }
  }
  function drRemoveFile(i) { _dr.files.splice(i, 1); _drRender(); }

  function drClear() { drReset(); renderContent(activeTool); }

  function _drResultsHtml() {
    const d = _dr.data;
    if (!d || !d.report_md) return '<div style="color:var(--text-muted);padding:20px">No report available.</div>';
    const reportHtml = (typeof marked !== 'undefined') ? marked.parse(d.report_md) : d.report_md.replace(/\n/g, '<br>');
    const srcCount = (d.sources && d.sources.length) || d.source_count || 0;
    return `
      <div class="vc-memo-outer">
        <div class="vc-memo-toolbar">
          <div class="vc-memo-files">
            ${d.title ? `<div style="font-weight:600;color:var(--text-primary);margin-bottom:4px">${_esc(d.title)}</div>` : ''}
            <strong style="color:var(--text-secondary)">Question:</strong> ${_esc(d.query || _dr.query)}
            ${srcCount ? ` &nbsp;·&nbsp; ${srcCount} source${srcCount > 1 ? 's' : ''} reviewed` : ''}${_savedBadge(d.saved_path)}
          </div>
          <div style="display:flex;gap:8px;flex-wrap:wrap">
            ${d.docx_b64 ? `<button class="vc-memo-download" onclick="drDownloadDocx()">💾 Save &amp; open in Word</button>` : ''}
          </div>
        </div>
        <div class="vc-memo-body">${reportHtml}</div>
      </div>
      ${_goDeeperMdPanel(d)}
      ${_forumsPanelHtml(d.discovered_forums, 'dr')}
      ${_drDeeperPanel()}
      ${_drExtractPanel()}`;
  }

  /* ── "How to go deeper" — framed emphasis panel (the assessment also lives at
     the end of the report body; this makes it impossible to miss) ───────────── */
  function _goDeeperMdPanel(d) {
    if (!d || !d.go_deeper_md) return '';
    const html = (typeof marked !== 'undefined') ? marked.parse(d.go_deeper_md)
                                                 : _esc(d.go_deeper_md).replace(/\n/g, '<br>');
    return `
      <div class="dr-godeeper-box">
        <div class="dr-godeeper-tag">⚑ How to go deeper</div>
        <div class="dr-godeeper-body">${html}</div>
      </div>`;
  }

  /* ── Discovered communities — forums the agent surfaced mid-run; one-click add
     to the curated sources list (dedupes against the saved list) ────────────── */
  const _forumAdded = {};   // domain -> 'busy' | 'added' | 'exists'
  function _forumsPanelHtml(list, view) {
    if (!Array.isArray(list) || !list.length) return '';
    const known = new Set((_dr.sources || []).map(s => (s.domain || '').trim().toLowerCase()).filter(Boolean));
    const rows = list.map((f, i) => {
      const key = (f && f.domain || '').trim().toLowerCase();
      if (!key) return '';
      const state = _forumAdded[key] || (known.has(key) ? 'exists' : '');
      const action = state === 'added'  ? `<span class="dr-forum-added">✓ added</span>`
                   : state === 'exists' ? `<span class="dr-forum-added" style="color:var(--text-muted)">already in sources</span>`
                   : state === 'busy'   ? `<span class="dr-forum-added" style="color:var(--text-muted)">adding…</span>`
                   : `<button class="dr-src-btn" onclick="drForumAdd('${view}', ${i})">+ Add to sources</button>`;
      return `
        <div class="dr-forum-row">
          <div class="dr-forum-info">
            <div class="dr-forum-dom">${_esc(f.domain)}</div>
            <div class="dr-forum-reason">${_esc(f.reason || '')}</div>
          </div>
          ${action}
        </div>`;
    }).join('');
    if (!rows) return '';
    return `
      <div class="dr-deeper-box" style="margin-top:14px">
        <div class="dr-refine-head">◆ Discovered communities</div>
        <div class="dr-refine-sub">Forums and communities the agent surfaced during this run —
          add any to your curated sources so future runs sweep them (and can store logins).</div>
        <div>${rows}</div>
      </div>`;
  }
  async function drForumAdd(view, i) {
    const st = _dr;
    const rerender = _drRender;
    const f = ((st.data && st.data.discovered_forums) || [])[i];
    if (!f) return;
    const dom = (f.domain || '').trim().toLowerCase();
    if (!dom || _forumAdded[dom] === 'busy' || _forumAdded[dom] === 'added') return;
    _forumAdded[dom] = 'busy'; rerender();
    try {
      const r = await fetch(`${PERF_SERVER}/api/deep_research/sources`);
      const j = await r.json();
      const srcs = Array.isArray(j.sources) ? j.sources : [];
      if (srcs.some(s => (s.domain || '').trim().toLowerCase() === dom)) {
        _forumAdded[dom] = 'exists';
      } else {
        srcs.push({ name: dom, domain: dom, type: 'forum', enabled: true,
                    description: String(f.reason || '').slice(0, 140) });
        const pr = await fetch(`${PERF_SERVER}/api/deep_research/sources`, {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ sources: srcs }) });
        if (!pr.ok) throw new Error('save failed (' + pr.status + ')');
        _forumAdded[dom] = 'added';
        if (_dr.sources !== null) _dr.sources = srcs;   // keep the Sources panel cache in sync
      }
    } catch (e) {
      delete _forumAdded[dom];
      _toast('Could not add ' + dom + ' to sources: ' + ((e && e.message) || e), false);
    }
    rerender();
  }

  function _drDeeperPanel() {
    if (!_dr.deeperOpen) {
      return `
        <div class="dr-deeper-cta">
          <div>
            <div class="dr-deeper-cta-title">Go deeper?</div>
            <div class="dr-deeper-cta-sub">Re-run the full research with this memo as context —
              restate or sharpen the question and add any new materials to push the next pass further.</div>
          </div>
          <button class="dr-run-btn" onclick="drGoDeeperOpen()">Go deeper →</button>
        </div>`;
    }
    const depths = [
      { id:'standard', label:'Standard', sub:'best outcome in ~5 min' },
      { id:'deep',     label:'Deep',     sub:'best outcome in ~10 min' },
      { id:'exhaustive', label:'1 hour', sub:'free-roam lanes until exhausted or 60 min' },
      { id:'odysseus', label:'Deep + Odysseus', sub:'headless pre-research → deep run' },
    ];
    const chips = depths.map(o => `
      <button type="button" class="dr-chip ${_dr.depth === o.id ? 'active' : ''}"
              onclick="drSetDepth('${o.id}')">
        <span class="dr-chip-label">${o.label}</span>
        <span class="dr-chip-sub">${o.sub}</span>
      </button>`).join('');
    const fileList = _dr.deeperFiles.length
      ? `<div class="dr-filelist">${_dr.deeperFiles.map((f,i) =>
          `<span class="dr-file-tag ${f._memo?'dr-file-memo':''}">${f._memo?'📄 ':''}${_esc(f.name)}<button onclick="drDeeperRemoveFile(${i})" title="Remove">✕</button></span>`).join('')}</div>`
      : '';
    return `
      <div class="dr-deeper-box">
        <div class="dr-refine-head">Go deeper</div>
        <div class="dr-refine-sub">The full research process re-runs with the materials below folded in as
          context. Restate or modify the question, then drop in any additional materials.</div>

        <label class="dr-label" style="margin-top:8px">Research question</label>
        <textarea id="dr-deeper-query" class="dr-textarea" rows="3"
          placeholder="Restate or sharpen the original question…"
          oninput="_dr.deeperQuery = this.value">${_esc(_dr.deeperQuery)}</textarea>

        <label class="dr-label" style="margin-top:16px">Depth</label>
        <div class="dr-chips">${chips}</div>

        ${_drChannelsHtml()}

        <div class="dr-attach-head" style="margin-top:20px">
          <div class="dr-attach-title">Materials &amp; context</div>
          <div class="dr-attach-sub">The prior report is included automatically. Add documents, files,
            decks, or notes — anything to ground and extend the next pass.</div>
        </div>
        <div class="pd-dropzone dr-drop-compact" id="dr-deeper-drop"
             ondragover="event.preventDefault();this.classList.add('pd-drop-active')"
             ondragleave="this.classList.remove('pd-drop-active')"
             ondrop="drDeeperHandleDrop(event)">
          <div class="pd-drop-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
                 stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
              <polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/>
            </svg>
          </div>
          <div class="pd-drop-title">Drag &amp; drop materials</div>
          <div class="pd-drop-sub">PDF, Excel, Word, PowerPoint, text — any document</div>
          <label class="pd-drop-btn" style="background:var(--ws-color, var(--admin-color))">
            Browse files
            <input type="file" multiple style="display:none" onchange="drDeeperHandleFile(this)">
          </label>
          ${fileList}
        </div>

        <div class="dr-run-row" style="margin-top:16px">
          <button class="dr-run-btn" onclick="drRunDeeper()">Re-run deeper →</button>
          <button class="dr-run-btn dr-run-secondary" onclick="drGoDeeperClose()">Cancel</button>
        </div>
      </div>`;
  }

  function drGoDeeperOpen() {
    const d = _dr.data || {};
    const md = d.report_md || '';
    _dr.deeperFiles = (_dr.files || []).filter(f => f && !f._memo);
    if (md) {
      const memo = new File([md], 'prior_research_memo.md', { type: 'text/markdown' });
      try { memo._memo = true; } catch (_) {}
      _dr.deeperFiles.push(memo);
    }
    _dr.deeperQuery = d.query || _dr.query || '';
    _dr.deeperOpen = true;
    _drRender();
  }
  function drGoDeeperClose() { _dr.deeperOpen = false; _drRender(); }
  function drDeeperHandleDrop(e) {
    e.preventDefault();
    document.getElementById('dr-deeper-drop')?.classList.remove('pd-drop-active');
    const files = Array.from(e.dataTransfer.files);
    if (files.length) { _dr.deeperFiles = _dr.deeperFiles.concat(files); _drRender(); }
  }
  function drDeeperHandleFile(input) {
    const files = Array.from(input.files);
    if (files.length) { _dr.deeperFiles = _dr.deeperFiles.concat(files); _drRender(); }
  }
  function drDeeperRemoveFile(i) { _dr.deeperFiles.splice(i, 1); _drRender(); }

  function drRunDeeper() {
    const ta = document.getElementById('dr-deeper-query');
    const q = ((ta && ta.value) || _dr.deeperQuery || '').trim();
    if (!q) { if (ta) { ta.focus(); ta.classList.add('dr-textarea-err'); setTimeout(()=>ta.classList.remove('dr-textarea-err'),1200);} return; }
    _dr.query = q;
    _dr.files = _dr.deeperFiles.slice();
    ++_dr.gen;
    _dr.data = null;
    _dr.deeperOpen = false;
    drStartJob('');
  }

  function drExtractOpen() { _dr.extractOpen = true; _dr.extractMode = _dr.extractMode || 'scrape'; _dr.extractLimit = _dr.extractLimit || 25; _drRender(); }
  function drExtractClose() { _dr.extractOpen = false; _drRender(); }
  function drExtractSetMode(m) { _dr.extractMode = m; _drRender(); }
  function drExtractPickUrl(u) { if (u) _dr.extractUrl = u; _drRender(); }

  async function drExtractRun() {
    const inp = document.getElementById('dr-extract-url');
    const url = ((inp && inp.value) || _dr.extractUrl || '').trim();
    if (!/^https?:\/\//i.test(url)) { _dr.extractError = 'Enter a valid http(s) URL.'; _drRender(); return; }
    _dr.extractUrl = url; _dr.extractError = null; _dr.extractResult = null;
    _dr.extractBusy = true; _dr.extractMsg = 'Starting…'; _dr.extractPct = null;
    const gen = ++_dr._extractGen;
    _drRender();
    try {
      const fd = new FormData();
      fd.append('url', url);
      fd.append('mode', _dr.extractMode || 'scrape');
      if (_dr.extractMode === 'crawl') fd.append('limit', String(_dr.extractLimit || 25));
      const j = await (await fetch(`${PERF_SERVER}/api/deep_research/extract`, { method: 'POST', body: fd })).json();
      if (j.error) throw new Error(j.error);
      const jobId = j.job_id;
      while (true) {
        await new Promise(r => setTimeout(r, 1500));
        if (gen !== _dr._extractGen) return;                       // superseded / reset
        const s = await (await fetch(`${PERF_SERVER}/api/deep_research/extract_status?job=${jobId}`)).json();
        if (gen !== _dr._extractGen) return;
        _dr.extractMsg = s.message || ''; _dr.extractPct = (s.pct != null) ? s.pct : null;
        if (s.done) {
          _dr.extractBusy = false;
          if (s.error) _dr.extractError = s.error; else _dr.extractResult = s.result;
          _drRender();
          return;
        }
        _drRender();
      }
    } catch (e) {
      if (gen !== _dr._extractGen) return;
      _dr.extractBusy = false; _dr.extractError = String((e && e.message) || e); _drRender();
    }
  }

  function drExtractDownload() {
    const res = _dr.extractResult; if (!res || !res.markdown) return;
    const blob = new Blob([res.markdown], { type: 'text/markdown' });
    const name = (res.url || 'extract').replace(/^https?:\/\//, '').replace(/[^a-z0-9.-]+/gi, '_').slice(0, 60) || 'extract';
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = name + '.md';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  }

  // Hosted (www) vs local (127.0.0.1) — the vault + logged-in profile only exist locally,

  function _drIsHosted() {

  // Source-access self-probe: run each site's logged-out native search from the SERVER that
  // served this page, so on the hosted site it reports what actually works from Render.
  function _drProbeLabel() { return '🛰 Test access from ' + (_drIsHosted() ? 'this server' : 'a headless guest'); }
  async function drProbeSources() {
    const btn = document.getElementById('dr-probe-btn');
    const panel = document.getElementById('dr-probe-panel');
    if (!panel) return;
    const doms = (_dr.sources || []).map(s => _drSiteDomain(s.url || s.domain || '')).filter(Boolean);
    if (!doms.length) { panel.innerHTML = '<div class="dr-probe-note">No sources to test.</div>'; return; }
    if (btn) { btn.disabled = true; btn.textContent = 'Testing…'; }
    panel.innerHTML = '<div class="dr-probe-note">Launching a logged-out browser and searching each site — a few seconds each…</div>';
    let pid;
    try {
      const j = await (await fetch(`${PERF_SERVER}/api/deep_research/probe_sources`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ domains: doms }) })).json();
      pid = j.probe_id;
    } catch (e) { panel.innerHTML = '<div class="dr-probe-note">Could not start the probe.</div>'; if (btn) btn.disabled = false; return; }
    for (let i = 0; i < 800; i++) {
      await new Promise(r => setTimeout(r, 1500));
      let st;
      try { st = await (await fetch(`${PERF_SERVER}/api/deep_research/probe_status?probe=${pid}`)).json(); }
      catch (e) { continue; }
      if (st.error && !(st.results || []).length) { panel.innerHTML = `<div class="dr-probe-note">Probe error: ${_esc(st.error)}</div>`; break; }
      panel.innerHTML = _drProbeHtml(st.results || [], st.total || doms.length, st.done);
      if (st.done) {
        // Write the measured verdict back onto the list: searchable without a login → 🟢,
        // otherwise → 🔴. Then re-render the dots and persist.
        (st.results || []).forEach(r => {
          const src = (_dr.sources || []).find(s => {
            const u = _drSiteDomain(s.url || s.domain || '');
            return u && (u === r.domain || u.endsWith('.' + r.domain) || r.domain.endsWith('.' + u));
          });
          if (src) src.login_required = !r.ok;
        });
        _drRender();
        const p2 = document.getElementById('dr-probe-panel');
        if (p2) p2.innerHTML = _drProbeHtml(st.results || [], st.total || doms.length, true);
        drSaveSources();
        break;
      }
    }
    if (btn) { btn.disabled = false; btn.textContent = _drProbeLabel(); }
  }
  function _drProbeHtml(results, total, done) {
    const ok = results.filter(r => r.ok).length;
    const rows = results.map(r => {
      const cls = r.ok ? 'ok' : (r.count === 0 ? 'no' : 'err');
      const verdict = r.ok ? `✓ searchable (${r.count})`
        : (r.count === 0 ? '✗ blocked / login needed here' : '⚠ error');
      return `<div class="dr-probe-row ${cls}"><span class="dr-probe-dom">${_esc(r.domain)}</span><span class="dr-probe-v">${verdict}</span></div>`;
    }).join('');
    const where = _drIsHosted() ? ' — from this server’s datacenter IP (true hosted picture)' : ' — headless guest';
    const head = done
      ? `<div class="dr-probe-head"><strong>${ok}/${results.length}</strong> searchable here without a login${where}.</div>`
      : `<div class="dr-probe-head">Testing… ${results.length}/${total}</div>`;
    return `<div class="dr-probe-box">${head}${rows}</div>`;
  }

        return `

          </tr>${editor}`;

      inner = `
        <div class="dr-src-body">
          ${_drIsHosted() ? `<div class="dr-src-hosted-note">🔒 <strong>Credentialed research runs on the local app.</strong> You're on the hosted site — it has no access to your saved vault, logins entered here are temporary, and a cloud server rarely gets past bot-protection on gated forums. For logged-in, deep-forum research, run Deep Research locally.</div>` : ''}
          <table class="dr-src-table dr-src-table-simple">
            <thead><tr><th title="🟢 searchable without a login · 🔴 needs a login · ⚪ untested"></th><th>Site</th><th></th><th></th></tr></thead>
            <tbody>${rows || '<tr><td colspan="4" style="color:var(--text-muted);padding:10px">No sources yet.</td></tr>'}</tbody>
          </table>

            <button class="dr-src-btn dr-src-save" onclick="drSaveSources()">Save sources</button>
            <button class="dr-src-btn" id="dr-probe-btn" onclick="drProbeSources()"
                    title="Run each site's logged-out search from THIS server, to see which work here without a login.">🛰 Test access from ${_drIsHosted() ? 'this server' : 'a headless guest'}</button>
            ${_drIsHosted() ? '' : `<button class="dr-src-btn dr-src-publish" id="dr-publish-btn" onclick="drPublishSources()"
                    title="Save, then commit the site list to the repo and push — Render redeploys centralindustrial.ai with it (~2 min). Only the list travels; your vault never does.">🚀 Publish to centralindustrial.ai</button>`}
            <span id="dr-src-msg" class="dr-src-msg"></span>
          </div>
          <div id="dr-probe-panel"></div>
          <div class="dr-src-note">One list, every site eligible — the research plan picks only the sites relevant to each query.
            🟢 searchable without a login (runs here and locally) · 🔴 needs a login: local uses your vault silently; otherwise you're asked once per search and nothing is saved · ⚪ untested.
            Click a dot to set it, or 🛰 Test to measure it from ${_drIsHosted() ? 'this server (Render’s datacenter IP — the true hosted picture)' : 'a headless guest (≈ the hosted environment)'}.
            ${_drIsHosted() ? 'This hosted site never stores logins — a relevant 🔴 site asks you once per search.' : '🔑/🔒 on a 🔴 row = store / stored login in your local vault.'}</div>
        </div>`;

    return `
      <div class="dr-src-panel">

  async function drToggleSources() {

  async function drRun(skipClarify) {
    const q = (_dr.query || '').trim();
    if (!q) {
